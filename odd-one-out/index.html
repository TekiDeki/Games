}
.homebtn:hover{border-color:var(--accent); color:var(--accent)}

}
.chip.strong{background:var(--accent-soft); color:var(--accent-ink); border-color:transparent}

.bar{height:100%; width:100%; background:var(--accent); border-radius:999px;
  transform-origin:left center; transition:transform .1s linear, background .2s}
.bar.low{background:var(--bad)}

.prompt{font-size:17px; font-weight:600; margin:0 0 14px; text-align:center; text-wrap:balance}

/* cele patru cuvinte ale rundei */
.opt{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px}
.tile{
  position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  min-height:104px; padding:14px 10px;
  background:var(--panel2); color:var(--text);
  border:1px solid var(--line); border-bottom:4px solid var(--line);
  border-radius:14px; cursor:pointer; font:inherit;
  transition:border-color .15s, transform .08s, background .15s;
}
.tile:hover:not(:disabled){border-color:var(--accent); border-bottom-color:var(--accent)}
.tile:active:not(:disabled){transform:translateY(1px)}
.tile:disabled{cursor:default}
.tile .w{
  font-weight:800; letter-spacing:.02em; line-height:1.1; text-align:center;
  font-size:clamp(19px,4.4vw,30px); word-break:break-word; hyphens:auto;
}
.tile .num{
  position:absolute; top:7px; left:9px; font-size:11px; font-weight:700; color:var(--muted); opacity:.75;
}
.tile .tag{
  font-size:12px; font-weight:700; letter-spacing:.02em; text-transform:none;
  padding:2px 9px; border-radius:999px; background:var(--panel); border:1px solid var(--line);
  color:var(--muted); visibility:hidden;
}
.tile.revealed .tag{visibility:visible}
.tile.good{background:var(--good-soft); border-color:var(--good); border-bottom-color:var(--good)}
.tile.good .w{color:var(--good-ink)}
.tile.bad{background:var(--bad-soft); border-color:var(--bad); border-bottom-color:var(--bad)}
.tile.bad .w{color:var(--bad)}
.tile.off{opacity:.55}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-5px)} 40%{transform:translateX(5px)}
  60%{transform:translateX(-3px)} 80%{transform:translateX(3px)}
}
.tile.shake{animation:shake .34s ease}
/* cine a cerut mai putina miscare primeste tot feedback-ul, dar fara scuturare:
   starea .bad (fundal rosu, chenar rosu, litera rosie) ramane vizibila */
@media (prefers-reduced-motion: reduce){
  .tile.shake{animation:none}
  .tile{transition:none}
  .bar{transition:none}
}

.msg{min-height:26px; text-align:center; font-weight:600; margin:0 0 12px}

var KEY = "odd-one-out-v1";
var RUNDE = 10;          /* cate runde are un joc */
var SECUNDE = 12;        /* cat timp ai pe o runda */
var TEMA_KEYS = ["animale","mancare","locuri"];

/* ?pauza=NNN fixeaza pauza dintre runde, in milisecunde (pentru teste automate) */
var PAUZA = 1500;
(function(){
  var m = /[?&]pauza=(\d+)/.exec(location.search);
  if(m){ PAUZA = Math.max(0, Math.min(20000, +m[1])); }
})();

var HOME_LBL = {ro:"Jocuri", en:"Games", sr:"Igre", src:"Игре"};
var HOME_TTL = {ro:"Inapoi la toate jocurile", en:"Back to all games",
                sr:"Nazad na sve igre", src:"Назад на све игре"};

var $ = function(id){ return document.getElementById(id); };

var state = {
  lang:"en",
  runda:0,             /* runda curenta, de la 1 */
  scor:0,
  corecte:0,
  istoric:[],          /* true = gasit, false = ratat sau timp expirat */
  cuvinte:[],          /* [{w, t, intrus}] cele 4 variante ale rundei */
  gata:false,          /* jocul s-a terminat */
  aratat:false,        /* raspunsul rundei e deja afisat */
  cronometru:null,
  urmat:null,          /* timeout-ul care porneste runda urmatoare */
  sfarsit:0,           /* timestamp-ul la care expira runda */
  serieCurenta:0,
  stats:{ro:{p:0,h:0,s:0,b:0}, en:{p:0,h:0,s:0,b:0},
         sr:{p:0,h:0,s:0,b:0}, src:{p:0,h:0,s:0,b:0}}
};

/* ---------- persistenta ---------- */
function load(){
  state.lang = "en";              /* limba principala: engleza (regula 29.10.2026) */
  try{
    var raw = localStorage.getItem(KEY);
    if(!raw) return;
    var d = JSON.parse(raw);
    if(d && d.stats){
      for(var k in state.stats){
        if(d.stats[k]) state.stats[k] = {
          p:+d.stats[k].p||0, h:+d.stats[k].h||0, s:+d.stats[k].s||0, b:+d.stats[k].b||0
        };
      }
    }
    if(d && d.lang && L[d.lang]) state.lang = d.lang;
  }catch(e){}
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify({stats:state.stats, lang:state.lang})); }catch(e){}
}

/* ---------- tema light/dark ---------- */
function applyTheme(t){
  if(t){ document.documentElement.setAttribute("data-theme", t); }
  else { document.documentElement.removeAttribute("data-theme"); }
}
function initTheme(){
  var salvat = null;
  try{ salvat = localStorage.getItem(KEY + "-theme"); }catch(e){}
  applyTheme(salvat);
  $("themeBtn").addEventListener("click", function(){
    var cur = document.documentElement.getAttribute("data-theme");
    var dark = cur ? cur === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    var next = dark ? "light" : "dark";
    applyTheme(next);
    try{ localStorage.setItem(KEY + "-theme", next); }catch(e){}
  });
}

/* ---------- texte ---------- */
function t(){ return L[state.lang]; }

function applyHome(){
  var a = $("homeBtn"), l = $("homeLbl");
  if(!a || !l) return;
  l.textContent = HOME_LBL[state.lang] || "Games";
  a.setAttribute("aria-label", HOME_TTL[state.lang] || "Back to all games");
  a.setAttribute("title", HOME_TTL[state.lang] || "Back to all games");
}

function applyTexts(){
  var d = t();
  applyHome();
  document.documentElement.lang = d.htmlLang;
  document.title = d.title;
  var m = document.querySelector('meta[name="description"]');
  if(m) m.setAttribute("content", d.desc);
  $("brandName").textContent = d.name;
  $("prompt").textContent = d.prompt;
  $("againBtn").textContent = d.again;
  $("shareBtn").textContent = d.share;
  $("stPlayedL").textContent = d.played;
  $("stHitsL").textContent = d.hits;
  $("stStreakL").textContent = d.streak;
  $("stBestL").textContent = d.best;
  $("h1").textContent = d.h1;
  $("p1").textContent = d.p1;
  $("h2").textContent = d.h2;
  $("p2").textContent = d.p2;
  $("p3").textContent = d.p3;
  $("foot").textContent = d.foot;
  $("supportText").textContent = d.supportText;
  $("supportLink").querySelector("span").textContent = d.supportLink;
  $("report").textContent = d.report;
  var lb = document.querySelectorAll(".langs button");
  for(var i=0;i<lb.length;i++){
    lb[i].setAttribute("aria-pressed", lb[i].getAttribute("data-lang") === state.lang ? "true" : "false");
  }
}

/* ---------- mersul jocului ---------- */
function intre(min, max){          /* numar intreg in [min, max] */
  return min + Math.floor(Math.random() * (max - min + 1));
}
function amesteca(a){
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random() * (i+1)), tmp = a[i];
    a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* o runda = 3 cuvinte dintr-o tema + 1 din alta tema */
function rundaNoua(){
  var d = W[state.lang];
  var baza = TEMA_KEYS[intre(0, TEMA_KEYS.length-1)];
  var alte = [], i;
  for(i=0;i<TEMA_KEYS.length;i++) if(TEMA_KEYS[i] !== baza) alte.push(TEMA_KEYS[i]);
  var temuIntrus = alte[intre(0, alte.length-1)];

  var dinBaza = amesteca(d[baza].slice()).slice(0,3);
  var dinIntrus = amesteca(d[temuIntrus].slice()).slice(0,1);

  var lista = [];
  for(i=0;i<3;i++) lista.push({w:dinBaza[i], t:baza, intrus:false});
  lista.push({w:dinIntrus[0], t:temuIntrus, intrus:true});
  state.cuvinte = amesteca(lista);
  state.aratat = false;
  state.cronometru = null;
}

function alege(i){
  if(state.gata || state.aratat) return;
  var ales = state.cuvinte[i];
  if(!ales) return;
  opresteCronometrul();
  var ramas = Math.max(0, Math.ceil((state.sfarsit - Date.now()) / 1000));
  var d = t(), bun = ales.intrus, castig = 0;

  state.aratat = true;
  state.istoric.push(bun);

  if(bun){
    /* 10 puncte pentru raspuns + timpul ramas + bonus de serie (max 5) */
    castig = 10 + ramas + Math.min(5, state.serieCurenta);
    state.scor += castig;
    state.corecte++;
    state.serieCurenta++;
    arataMesaj(d.correct + ales.w + ".", "good");
  }else{
    state.serieCurenta = 0;
    arataMesaj(d.wrong + gasesteIntrusul().w + ".", "bad");
  }
  deseneaza({aleas:i, castig:castig, bun:bun});
  $("scoreChip").textContent = d.scoreLbl + ": " + state.scor;
  programeazaUrmatoarea();
}

function expira(){
  if(state.gata || state.aratat) return;
  opresteCronometrul();
  state.aratat = true;
  state.istoric.push(false);
  state.serieCurenta = 0;
  arataMesaj(t().timeup + gasesteIntrusul().w + ".", "bad");
  deseneaza({aleas:-1, castig:0, bun:false});
  programeazaUrmatoarea();
}

function gasesteIntrusul(){
  for(var i=0;i<state.cuvinte.length;i++) if(state.cuvinte[i].intrus) return state.cuvinte[i];
  return state.cuvinte[0];
}

function arataMesaj(text, fel){
  var m = $("msg");
  m.textContent = text;
  m.className = "msg " + (fel || "neutral");
}

/* ---------- desenare ---------- */
function deseneaza(rez){
  var d = t(), i, el;
  var opt = $("opt");
  opt.innerHTML = "";
  for(i=0;i<state.cuvinte.length;i++){
    var c = state.cuvinte[i];
    el = document.createElement("button");
    el.type = "button";
    el.className = "tile";
    el.setAttribute("data-tema", c.t);
    el.setAttribute("data-intrus", c.intrus ? "1" : "0");
    el.setAttribute("data-i", String(i));
    el.innerHTML = '<span class="num" aria-hidden="true">' + (i+1) + '</span>' +
                   '<span class="w"></span><span class="tag"></span>';
    el.querySelector(".w").textContent = c.w;      /* textContent: cuvintele pot avea diacritice */
    el.querySelector(".tag").textContent = d.cats[c.t];
    el.setAttribute("aria-label", (i+1) + ": " + c.w);
    if(rez){
      el.disabled = true;
      el.className += " revealed";
      if(c.intrus) el.className += " good";
      if(rez.aleas === i && !c.intrus){
        el.className += " bad shake";
      }
      if(!c.intrus && rez.aleas !== i) el.className += " off";
      if(c.intrus && rez.aleas === i && rez.bun) el.className += " win";
    }
    opt.appendChild(el);
  }
  $("roundChip").textContent = d.roundLbl + " " + state.runda + "/" + RUNDE;
}

/* ---------- cronometru ---------- */
function pornesteRunda(){
  var d = t();
  rundaNoua();
  deseneaza(null);
  arataMesaj(d.ready, "neutral");
  $("roundChip").textContent = d.roundLbl + " " + state.runda + "/" + RUNDE;
  $("scoreChip").textContent = d.scoreLbl + ": " + state.scor;
  $("bar").className = "bar";
  $("bar").style.transform = "scaleX(1)";
  $("timeChip").textContent = SECUNDE + d.seconds;
  state.sfarsit = Date.now() + SECUNDE * 1000;
  opresteCronometrul();
  state.cronometru = window.setInterval(tic, 100);
}

function tic(){
  var ramas = Math.max(0, state.sfarsit - Date.now());
  var proc = ramas / (SECUNDE * 1000);
  $("bar").style.transform = "scaleX(" + proc.toFixed(3) + ")";
  $("bar").className = proc < 0.3 ? "bar low" : "bar";
  $("timeChip").textContent = Math.ceil(ramas / 1000) + t().seconds;
  if(ramas <= 0){ expira(); }
}

function opresteCronometrul(){
  if(state.cronometru){ window.clearInterval(state.cronometru); state.cronometru = null; }
}
/* un singur timeout de "runda urmatoare" o data: altfel unul vechi reporneste o runda
   peste un joc nou si sare runde. Se opreste la joc nou si la fiecare raspuns. */
function opresteUrmatorul(){
  if(state.urmat){ window.clearTimeout(state.urmat); state.urmat = null; }
}
function programeazaUrmatoarea(){
  opresteUrmatorul();
  state.urmat = window.setTimeout(function(){
    state.urmat = null;
    if(state.runda >= RUNDE){ finalizeaza(); }
    else { state.runda++; pornesteRunda(); }
  }, PAUZA);
}

/* ---------- sfarsitul jocului ---------- */
function finalizeaza(){
  var d = t(), st = state.stats[state.lang];
  state.gata = true;
  opresteCronometrul();
  opresteUrmatorul();
  $("bar").style.transform = "scaleX(0)";
  $("timeChip").textContent = "0" + d.seconds;

  st.p = (st.p||0) + 1;
  st.h = (st.h||0) + state.corecte;
  st.s = Math.max(st.s||0, state.corecte);
  st.b = Math.max(st.b||0, state.scor);
  save();

  arataMesaj(d.finA + state.corecte + d.finB + RUNDE + d.finC + state.scor + " " + d.scoreWord + ".", 
             state.corecte >= 7 ? "good" : (state.corecte <= 3 ? "bad" : "neutral"));
  $("againBtn").textContent = d.again;
  afiseazaStatistici();
}

function afiseazaStatistici(){
  var st = state.stats[state.lang];
  $("stPlayed").textContent = st.p||0;
  $("stHits").textContent = st.h||0;
  $("stStreak").textContent = st.s||0;
  $("stBest").textContent = st.b||0;
}

/* ---------- joc nou ---------- */
function jocNou(){
  opresteCronometrul();
  opresteUrmatorul();
  state.runda = 1;
  state.scor = 0;
  state.corecte = 0;
  state.istoric = [];
  state.serieCurenta = 0;
  state.gata = false;
  $("againBtn").textContent = t().again;
  pornesteRunda();
  afiseazaStatistici();
}

/* ---------- copierea rezultatului ---------- */
function liniiRezultat(){
  var d = t(), linie = "", i;
  for(i=0;i<state.istoric.length;i++) linie += state.istoric[i] ? "🟩" : "🟥";
  return [ d.name + " · " + state.corecte + "/" + RUNDE,
           linie,
           state.scor + " " + d.scoreWord,
           "https://games.freehtml.dev/odd-one-out/" ];
}

function copiaza(){
  var text = liniiRezultat().join("\n");
  var gata = function(){
    arataMesaj(t().copied, "good");
    window.setTimeout(function(){
      if(!state.gata) arataMesaj(t().ready, "neutral");
    }, 2200);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(gata, rezerva);
  }else{ rezerva(); }

  function rezerva(){
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand("copy"); }catch(e){}
    document.body.removeChild(ta);
    gata();
  }
}

/* ---------- evenimente ---------- */
$("opt").addEventListener("click", function(e){
  var b = e.target.closest ? e.target.closest(".tile") : null;
  if(!b) return;
  alege(+b.getAttribute("data-i"));
});

$("againBtn").addEventListener("click", jocNou);
$("shareBtn").addEventListener("click", copiaza);

document.addEventListener("keydown", function(e){
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  var k = e.key;
  if(k >= "1" && k <= "4"){ alege(+k - 1); return; }
  if(k === "n" || k === "N"){ jocNou(); }
});

var langBtns = document.querySelectorAll(".langs button");
for(var i=0;i<langBtns.length;i++){
  langBtns[i].addEventListener("click", function(){
    var l = this.getAttribute("data-lang");
    if(!L[l] || l === state.lang) return;
    state.lang = l;
    save();
    applyTexts();
    jocNou();          /* limba noua = cuvinte noi, deci joc nou */
  });
}

/* ---------- pornire ---------- */
load();
initTheme();
applyTexts();
afiseazaStatistici();
jocNou();

})();
</script>
