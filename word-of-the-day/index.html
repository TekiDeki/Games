  --bg:#f6f7fb; --panel:#ffffff; --panel2:#eef1f8; --text:#111827; --muted:#5b6472;
  --line:#d8dee9; --accent:#2563eb; --accent-soft:#dbe6ff; --good:#157f3c; --bad:#b3261e;
  --accent-ink:#1d4ed8; --good-ink:#126b32;
  --tile:#ffffff; --tile-line:#cfd6e4;
  --ok-bg:#157f3c; --ok-ink:#ffffff; --near-bg:#c98a00; --near-ink:#ffffff;
  --off-bg:#8b93a3; --off-ink:#ffffff;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.08);
}
html[data-theme="dark"]{
  --bg:#0b1220; --panel:#111a2b; --panel2:#182338; --text:#e8edf6; --muted:#9aa7bd;
  --line:#26334b; --accent:#6b9dff; --accent-soft:#1b2c4d; --good:#4ade80; --bad:#ff7a70;
  --accent-ink:#6b9dff; --good-ink:#4ade80;
  --tile:#111a2b; --tile-line:#2b3a55;
  --ok-bg:#1f7a44; --ok-ink:#ffffff; --near-bg:#8a6200; --near-ink:#ffffff;
  --off-bg:#3a465e; --off-ink:#dfe6f2;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--text);
  font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:960px; margin:0 auto; padding:18px 16px 48px}
header{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:16px}
.brand{display:flex; align-items:center; gap:10px; font-weight:700; font-size:18px; letter-spacing:-.01em}
.dot{width:30px;height:30px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center}
.dot svg{display:block}
.spacer{flex:1}
.iconbtn{
  border:1px solid var(--line); background:var(--panel); color:var(--text);
  border-radius:10px; padding:8px 10px; cursor:pointer; font-size:15px; line-height:1;
}
.iconbtn:hover{border-color:var(--accent)}
/* link de intoarcere la hub-ul de jocuri */
.homebtn{
  display:inline-flex; align-items:center; gap:7px; text-decoration:none;
  border:1px solid var(--line); background:var(--panel); color:var(--text);
  border-radius:10px; padding:8px 12px; font-size:14px; font-weight:600; line-height:1;
}
.homebtn:hover{border-color:var(--accent); color:var(--accent)}
.homebtn:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.homebtn .arw{font-size:15px; line-height:1}
.langs{display:flex; gap:4px; background:var(--panel2); border:1px solid var(--line); border-radius:11px; padding:3px}
.langs button{
  border:0; background:transparent; color:var(--muted); font:inherit; font-size:13px; font-weight:600;
  padding:6px 9px; border-radius:8px; cursor:pointer;
}
.langs button[aria-pressed="true"]{background:var(--panel); color:var(--text); box-shadow:var(--shadow)}
.card{
  background:var(--panel); border:1px solid var(--line); border-radius:16px;
  box-shadow:var(--shadow); padding:18px; margin-bottom:16px;
}
.topline{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:16px}
.chip{
  font-size:13px; font-weight:600; color:var(--muted); background:var(--panel2);
  border:1px solid var(--line); border-radius:999px; padding:4px 11px;
}
.chip.click{cursor:pointer}
.chip.click:hover{border-color:var(--accent); color:var(--text)}
.chip.mode{color:var(--accent-ink); border-color:var(--accent); background:var(--accent-soft)}

/* tabla */
.board{display:flex; flex-direction:column; gap:6px; align-items:center; margin:6px 0 4px}
.row{display:flex; gap:6px}
.cell{
  width:52px; height:52px; border-radius:9px; border:2px solid var(--tile-line);
  background:var(--tile); display:grid; place-items:center;
  font-size:24px; font-weight:800; text-transform:uppercase; color:var(--text);
  transition:background .15s, border-color .15s, color .15s;
}
.cell.filled{border-color:var(--accent)}
.cell.hinted{border-style:dashed; border-color:var(--accent); color:var(--accent)}
.cell.good{background:var(--ok-bg); border-color:var(--ok-bg); color:var(--ok-ink)}
.cell.near{background:var(--near-bg); border-color:var(--near-bg); color:var(--near-ink)}
.cell.off{background:var(--off-bg); border-color:var(--off-bg); color:var(--off-ink)}
.row.done .cell{animation:none}

/* tastatura */
.kbd{display:flex; flex-direction:column; gap:6px; align-items:center; margin-top:16px}
.krow{display:flex; gap:5px; justify-content:center; flex-wrap:nowrap}
.key{
  min-width:34px; height:46px; padding:0 6px; border-radius:8px; cursor:pointer;
  border:1px solid var(--line); background:var(--panel2); color:var(--text);
  font:inherit; font-size:15px; font-weight:700; text-transform:uppercase;
}
.key:hover{border-color:var(--accent)}
.key:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.key.wide{min-width:110px; font-size:15px}
.key.good{background:var(--ok-bg); border-color:var(--ok-bg); color:var(--ok-ink)}
.key.near{background:var(--near-bg); border-color:var(--near-bg); color:var(--near-ink)}
.key.off{background:var(--off-bg); border-color:var(--off-bg); color:var(--off-ink)}
.key:disabled{opacity:.35; cursor:default}

.msg{text-align:center; font-weight:600; min-height:26px; margin:14px 0 6px}
.msg.win{color:var(--good)} .msg.bad{color:var(--bad)}
.actions{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:8px}
.btn{
  border:1px solid var(--accent); background:var(--accent); color:#fff;
  border-radius:11px; padding:11px 18px; font:inherit; font-weight:700; cursor:pointer;
}
.btn.ghost{background:transparent; color:var(--text); border-color:var(--line)}
.btn:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.45; cursor:default; filter:none}
.stats{display:flex; gap:18px; justify-content:center; flex-wrap:wrap; margin-top:14px; color:var(--muted); font-size:14px}
.stats b{color:var(--text); font-size:17px; display:block; text-align:center}
.stats span{display:block; text-align:center}
h1{font-size:24px; letter-spacing:-.02em; margin:0 0 8px}
h2{font-size:18px; margin:22px 0 8px}
p{margin:0 0 12px; color:var(--muted)}
p strong{color:var(--text)}
.note{font-size:13px}
footer{color:var(--muted); font-size:13px; text-align:center; margin-top:28px; line-height:1.9}
footer a{color:var(--accent); text-decoration:none; font-weight:600}
footer a{display:inline-block; padding:5px 2px; min-height:24px; min-width:24px}
footer a:hover{text-decoration:underline}
footer .sep{opacity:.5; margin:0 4px}
.shake{animation:shake .3s ease-in-out 2}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (max-width:560px){
  header{gap:8px; margin-bottom:12px}
  .spacer{display:none}
  .brand{flex:1 1 auto; min-width:0; font-size:16px}
  .langs{order:10; width:100%; justify-content:space-between}
  .langs button{flex:1; padding:6px 7px; font-size:12px}
  .iconbtn{margin-left:auto}
  .wrap{padding:12px 10px 32px}
  .dot{width:26px;height:26px;border-radius:8px}
  .card{padding:14px; border-radius:14px}
  .cell{width:40px; height:40px; font-size:19px; border-width:2px}
  .row{gap:5px}
  .key{min-width:27px; height:42px; font-size:13px; padding:0 4px}
  .key.wide{min-width:96px; font-size:14px}
  .krow{gap:4px}
  .chip{font-size:12px; padding:3px 9px}
  .btn{padding:10px 14px; font-size:15px}
  .stats{gap:12px; font-size:12px}
  .stats b{font-size:16px}
}
@media (prefers-reduced-motion: reduce){ .shake{animation:none} }
</style>

var KEY = "word-of-the-day-v1";
var MAX_TRIES = 6;
var HOME_LBL = {ro:"Jocuri", en:"Games", sr:"Igre", src:"Игре"};
var HOME_TTL = {ro:"Inapoi la toate jocurile", en:"Back to all games",
                sr:"Nazad na sve igre", src:"Назад на све игре"};

var $ = function(id){ return document.getElementById(id); };

var state = {
  lang:"en",
  mode:"day",          /* "day" sau "free" */
  answer:"",
  theme:"",
  rows:[],             /* [{word:"", score:["good","near","off"]}] */
  cur:[],              /* literele tastate, null pe pozitiile libere */
  locked:[],           /* pozitii completate de indiciu */
  penalty:0,           /* incercari consumate de indicii */
  over:false,
  won:false,
  dayDone:false,
  stats:{ro:{p:0,w:0,s:0,b:0}, en:{p:0,w:0,s:0,b:0}, sr:{p:0,w:0,s:0,b:0}, src:{p:0,w:0,s:0,b:0}},
  days:{ro:null, en:null, sr:null, src:null}
};

/* ---------- ziua ---------- */
function ziUtc(){
  var d = new Date();
  return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
}
function numarZi(){
  /* ziua 1 = 1 ianuarie 2026 */
  return ziUtc() - Math.floor(Date.UTC(2026,0,1) / 86400000) + 1;
}
function pool(lang){
  var out = [], tema, lista, i;
  for(tema in W[lang]){
    lista = W[lang][tema];
    for(i=0;i<lista.length;i++) out.push({w:lista[i], t:tema});
  }
  return out;
}
function ziCuvant(lang){
  var p = pool(lang);
  return p[ziUtc() % p.length];
}
function liber(lang, fara){
  var p = pool(lang), x, incercari = 0;
  do{ x = p[Math.floor(Math.random()*p.length)]; incercari++; }
  while(x.w === fara && incercari < 12);
  return x;
}

/* ---------- persistenta ---------- */
function load(){
  state.lang = "en";              /* limba principala: engleza (regula 29.10.2026) */
  try{
    var raw = localStorage.getItem(KEY);
    if(!raw) return;
    var d = JSON.parse(raw);
    if(d && d.stats){
      for(var k in state.stats){
        if(d.stats[k]) state.stats[k] = {
          p:+d.stats[k].p||0, w:+d.stats[k].w||0, s:+d.stats[k].s||0, b:+d.stats[k].b||0
        };
      }
    }
    if(d && d.days){
      for(var j in state.days){
        if(d.days[j] && d.days[j].zi === ziUtc()) state.days[j] = d.days[j];
      }
    }
    if(d && d.lang && L[d.lang]) state.lang = d.lang;
  }catch(e){}
}
function save(){
  try{
    localStorage.setItem(KEY, JSON.stringify({stats:state.stats, days:state.days, lang:state.lang}));
  }catch(e){}
}

/* ---------- tema light/dark ---------- */
function applyTheme(t){
  if(t){ document.documentElement.setAttribute("data-theme", t); }
  else { document.documentElement.removeAttribute("data-theme"); }
}
function initTheme(){
  var salvat = null;
  try{ salvat = localStorage.getItem(KEY + "-theme"); }catch(e){}
  applyTheme(salvat);
  $("themeBtn").addEventListener("click", function(){
    var cur = document.documentElement.getAttribute("data-theme");
    var dark = cur ? cur === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    var next = dark ? "light" : "dark";
    applyTheme(next);
    try{ localStorage.setItem(KEY + "-theme", next); }catch(e){}
  });
}

/* ---------- texte ---------- */
function t(){ return L[state.lang]; }

function applyHome(){
  var a = $("homeBtn"), l = $("homeLbl");
  if(!a || !l) return;
  l.textContent = HOME_LBL[state.lang] || "Games";
  a.setAttribute("aria-label", HOME_TTL[state.lang] || "Back to all games");
  a.setAttribute("title", HOME_TTL[state.lang] || "Back to all games");
}

function applyTexts(){
  var d = t();
  applyHome();
  document.documentElement.lang = d.htmlLang;
  document.title = d.title;
  var m = document.querySelector('meta[name="description"]');

  for(var i=0;i<btns.length;i++){
    btns[i].setAttribute("aria-pressed", btns[i].getAttribute("data-lang") === state.lang ? "true" : "false");
  }
  $("themeBtn").setAttribute("aria-label", state.lang === "en" ? "Theme" : (state.lang === "ro" ? "Tema" : "Tema"));

/* ---------- joc ---------- */
function porneste(mod, cuvant){
  var c = cuvant || (mod === "day" ? ziCuvant(state.lang) : liber(state.lang, state.answer));
  state.mode = mod;
  state.answer = c.w;
  state.theme = c.t;
  state.rows = [];
  state.cur = new Array(c.w.length).fill(null);
  state.locked = new Array(c.w.length).fill(null);
  state.penalty = 0;
  state.over = false;
  state.won = false;
  state.dayDone = false;
  $("msg").textContent = "";
  $("msg").className = "msg";
  render();
}

function incarcaZiua(){
  var rec = state.days[state.lang];
  if(rec && rec.zi === ziUtc()){
    var c = ziCuvant(state.lang);
    state.mode = "day";
    state.answer = c.w;
    state.theme = c.t;
    state.cur = new Array(c.w.length).fill(null);
    state.locked = new Array(c.w.length).fill(null);
    state.rows = (rec.rows || []).map(function(r){
      return {word:r, score:score(r, c.w)};
    });
    state.penalty = rec.penalty || 0;
    state.won = !!rec.won;
    state.over = true;
    state.dayDone = true;
    render();
    $("msg").textContent = state.won ? (t().win + state.rows.length + t().winTries) : t().done;
    $("msg").className = "msg " + (state.won ? "win" : "bad");
    return true;
  }
  return false;
}

function score(ghicit, raspuns){
  var n = raspuns.length, res = new Array(n).fill(null), folosit = new Array(n).fill(false), i, j;
  for(i=0;i<n;i++){
    if(ghicit[i] === raspuns[i]){ res[i] = "good"; folosit[i] = true; }
  }
  for(i=0;i<n;i++){
    if(res[i] !== null) continue;
    for(j=0;j<n;j++){
      if(!folosit[j] && raspuns[j] === ghicit[i]){ res[i] = "near"; folosit[j] = true; break; }
    }
    if(res[i] === null) res[i] = "off";
  }
  return res;
}

function litereTastate(){
  return state.cur.filter(function(x){ return x !== null; }).length +
         state.locked.filter(function(x){ return x !== null; }).length;
}

function render(){
  var d = t();
  var n = state.answer.length;

  /* chip-uri */
  $("modeChip").textContent = state.mode === "day" ? d.modeDay : d.modeFree;
  $("themeChip").textContent = d.themeLbl + ": " + d.cats[state.theme];
  $("lenChip").textContent = n + " " + d.letters;
  /* arata cate incercari s-au folosit, nu cate au mai ramas (mai putin confuz) */
  var folosite = Math.min(MAX_TRIES, state.rows.length + state.penalty);
  $("triesChip").textContent = d.tries + ": " + folosite + "/" + MAX_TRIES;

  /* tabla */
  var board = $("board");
  board.innerHTML = "";
  for(var r=0;r<MAX_TRIES;r++){
    var row = document.createElement("div");
    row.className = "row";
    var cuv = null, sc = null;
    if(state.rows[r]){ cuv = state.rows[r].word; sc = state.rows[r].score; }
    else if(r === state.rows.length && !state.over){ cuv = combinatie(); }

    for(var i=0;i<n;i++){
      var c = document.createElement("div");
      c.className = "cell";
      var litera = "";
      if(cuv && cuv[i]) litera = cuv[i];
      if(litera) c.textContent = litera;
      if(sc && sc[i]) c.className += " " + sc[i];
      if(!sc && r === state.rows.length && !state.over){
        if(litera) c.className += " filled";
        if(state.locked[i]) c.className += " hinted";
      }
      row.appendChild(c);
    }
    if(sc) row.className += " done";
    board.appendChild(row);
  }

  /* tastatura */
  var kbd = $("kbd");
  kbd.innerHTML = "";
  var abc = ABC[state.lang].split("");
  var stari = starileLiterelor();
  var i;
  var per = Math.ceil(abc.length / 3);
  var randuri = [abc.slice(0, per), abc.slice(per, per * 2), abc.slice(per * 2)];
  var k;
  for(k=0;k<randuri.length;k++){
    var kr = document.createElement("div");
    kr.className = "krow";
    for(i=0;i<randuri[k].length;i++) kr.appendChild(tasta(randuri[k][i], stari));
    kbd.appendChild(kr);
  }
  /* stergere si trimitere, pe randul lor, ca sa incapa pe telefon */
  var ultim = document.createElement("div");
  ultim.className = "krow";
  ultim.appendChild(tastaSpeciala("back", "⌫"));
  ultim.appendChild(tastaSpeciala("enter", "⏎"));
  kbd.appendChild(ultim);

  /* butoane */
  var gol = litereTastate() === 0;
  $("hintBtn").disabled = state.over || state.locked.indexOf(null) === -1 ||
                          (state.rows.length + state.penalty) >= MAX_TRIES - 1;
  if(state.mode === "day" && state.over && !state.dayDone){
    $("againBtn").textContent = d.freeBtn;
  } else if(state.mode === "day" && state.dayDone){
    $("againBtn").textContent = d.freeBtn;
  } else {
    $("againBtn").textContent = d.again;
  }
  $("shareBtn").disabled = state.rows.length === 0;

  /* statistici */
  var s = state.stats[state.lang];
  $("stPlayed").textContent = s.p;
  $("stWon").textContent = s.w;
  $("stStreak").textContent = s.s;
  $("stBest").textContent = s.b;
}

function combinatie(){
  var out = [], n = state.answer.length;
  for(var i=0;i<n;i++) out.push(state.locked[i] || state.cur[i] || "");
  return out.join("");
}

function starileLitereaLitere(){
  /* cel mai bun rezultat al fiecarei litere, pentru colorarea tastaturii */
  var rang = {good:3, near:2, off:1};
  var out = {};
  for(var r=0;r<state.rows.length;r++){
    var cuv = state.rows[r].word, sc = state.rows[r].score;
    for(var i=0;i<cuv.length;i++){
      var ch = cuv[i];
      if(!out[ch] || rang[sc[i]] > rang[out[ch]]) out[ch] = sc[i];
    }
  }
  return out;
}
function starileLiterelor(){ return starileLitereaLitere(); }

function tasta(ch, stari){
  var b = document.createElement("button");
  b.type = "button";
  b.className = "key";
  b.textContent = ch;
  b.setAttribute("data-k", ch);
  if(stari[ch]) b.className += " " + stari[ch];
  if(state.over) b.disabled = true;
  b.addEventListener("click", function(){ apasa(ch); });
  return b;
}

function tastaSpeciala(ce, text){
  var b = document.createElement("button");
  b.type = "button";
  b.className = "key wide";
  b.textContent = text;
  b.setAttribute("data-k", ce);
  if(state.over) b.disabled = true;
  b.addEventListener("click", function(){
    if(ce === "back") sterge();
    else incearca();
  });
  return b;
}

/* ---------- actiuni ---------- */
function apasa(ch){
  if(state.over) return;
  if(litereTastate() >= state.answer.length) return;
  for(var i=0;i<state.answer.length;i++){
    if(state.locked[i]) continue;
    if(state.cur[i] === null){ state.cur[i] = ch; break; }
  }
  $("msg").textContent = "";
  $("msg").className = "msg";
  render();
}

function sterge(){
  if(state.over) return;
  for(var i=state.answer.length-1;i>=0;i--){
    if(state.locked[i]) continue;
    if(state.cur[i] !== null){ state.cur[i] = null; break; }
  }
  render();
}

function incearca(){
  if(state.over) return;
  var d = t();
  var ghicit = combinatie();
  /* atentie: "text".indexOf("") intoarce 0, deci nu se poate testa asa daca randul e plin */
  var plin = true, i;
  for(i=0;i<state.answer.length;i++){
    if(state.locked[i] === null && state.cur[i] === null){ plin = false; break; }
  }
  if(!plin || ghicit.length !== state.answer.length){
    $("msg").textContent = d.short;
    $("msg").className = "msg bad";
    $("board").classList.add("shake");
    setTimeout(function(){ $("board").classList.remove("shake"); }, 650);
    return;
  }
  state.rows.push({word:ghicit, score:score(ghicit, state.answer)});
  state.cur = new Array(state.answer.length).fill(null);
  state.locked = new Array(state.answer.length).fill(null);

  if(ghicit === state.answer){
    state.over = true; state.won = true;
    finalizeaza(true);
    $("msg").textContent = state.rows.length === 1 ? d.winOne : (d.win + state.rows.length + d.winTries);
    $("msg").className = "msg win";
  } else if(state.rows.length + state.penalty >= MAX_TRIES){
    state.over = true; state.won = false;
    finalizeaza(false);
    $("msg").textContent = d.lose + state.answer;
    $("msg").className = "msg bad";
  }
  render();
}

function finalizeaza(castigat){
  var s = state.stats[state.lang];
  s.p++;
  if(castigat){
    s.w++;
    s.s++;
    if(s.s > s.b) s.b = s.s;
  } else {
    s.s = 0;
  }
  if(state.mode === "day"){
    state.days[state.lang] = {
      zi: ziUtc(),
      won: castigat,
      penalty: state.penalty,
      rows: state.rows.map(function(r){ return r.word; })
    };
    state.dayDone = true;
  }
  save();
}

function indiciu(){
  if(state.over) return;
  var d = t();
  var liber = state.locked.indexOf(null);
  if(liber === -1){ $("msg").textContent = d.hintNone; return; }
  state.locked[liber] = state.answer[liber];
  if(state.cur[liber]) state.cur[liber] = null;
  state.penalty++;
  $("msg").textContent = d.penalty;
  $("msg").className = "msg";
  if(state.rows.length + state.penalty >= MAX_TRIES){
    state.over = true; state.won = false;
    finalizeaza(false);
    $("msg").textContent = d.lose + state.answer;
    $("msg").className = "msg bad";
  }
  render();
}

function altCuvant(){
  var d = t();
  if(state.mode === "day" && !state.over){
    /* cuvantul zilei nu se schimba: trecem pe joc liber */
    porneste("free");
    return;
  }
  if(state.mode === "day" && state.over){
    porneste("free");
    return;
  }
  porneste("free", liber(state.lang, state.answer));
}

function copiaza(){
  var d = t();
  var emoji = {good:"🟩", near:"🟨", off:"⬛"};
  var linii = [d.modeDay + " #" + numarZi() + " · " + state.rows.length + "/" + MAX_TRIES];
  for(var r=0;r<state.rows.length;r++){
    var linie = "";
    for(var i=0;i<state.rows[r].score.length;i++) linie += emoji[state.rows[r].score[i]];
    linii.push(linie);
  }
  linii.push("https://games.freehtml.dev/word-of-the-day/");
  var text = linii.join("\n");
  function gata(){
    $("msg").textContent = d.copied;
    $("msg").className = "msg win";
    setTimeout(function(){
      if($("msg").textContent === d.copied){ $("msg").textContent = ""; $("msg").className = "msg"; }
    }, 2200);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(gata, function(){ rezerva(text); gata(); });
  } else {
    rezerva(text); gata();
  }
}
function rezerva(text){
  var ta = document.createElement("textarea");
  ta.value = text;
  ta.setAttribute("readonly", "");
  ta.style.position = "fixed";
  ta.style.left = "-9999px";
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta);
}

/* ---------- limba ---------- */
function setLang(l){
  if(!L[l]) return;
  state.lang = l;
  applyTexts();
  if(!incarcaZiua()) porneste("day");
  save();
}

/* ---------- start ---------- */
load();
applyTexts();
initTheme();
if(!incarcaZiua()) porneste("day");

$("againBtn").addEventListener("click", altCuvant);
$("hintBtn").addEventListener("click", indiciu);
$("shareBtn").addEventListener("click", copiaza);

var langBtns = document.querySelectorAll(".langs button");
for(var i=0;i<langBtns.length;i++){
  langBtns[i].addEventListener("click", (function(b){
    return function(){ setLang(b.getAttribute("data-lang")); };
  })(langBtns[i]));
}

document.addEventListener("keydown", function(e){
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  if(e.key === "Enter"){ e.preventDefault(); incearca(); return; }
  if(e.key === "Backspace"){ e.preventDefault(); sterge(); return; }
  if(e.key.length !== 1) return;
  var ch = e.key.toUpperCase();
  var abc = ABC[state.lang];
  if(abc.indexOf(ch) === -1){
    /* fara diacritice: A -> Ă etc. daca litera simpla nu exista in alfabet */
    var perechi = {"A":["Ă","Â"],"I":["Î"],"S":["Ș"],"T":["Ț"],
                   "C":["Č","Ć"],"D":["Đ"],"Z":["Ž"]};
    var alt = perechi[ch];
    if(alt){
      for(var i2=0;i2<alt.length;i2++){
        if(abc.indexOf(alt[i2]) !== -1){ ch = alt[i2]; break; }
      }
    }
  }
  if(abc.indexOf(ch) === -1) return;
  e.preventDefault();
  apasa(ch);
});
})();
</script>

if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("../sw.js").catch(function () {});
  });
}
</script>
