  --bg:#0f172a; --card:#1e293b; --text:#e2e8f0; --muted:#94a3b8; --line:#334155;

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{

  font-size:.9rem; font-family:inherit; line-height:1;
}
.iconbtn:hover{border-color:var(--blue)}
.iconbtn[aria-pressed="true"]{background:var(--blue-soft); border-color:var(--blue); color:var(--blue); font-weight:600}
main{width:100%; max-width:820px}
.card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px}

.bara .grup{display:flex; gap:6px}

.chip.strong{border-color:var(--blue); color:var(--blue)}
.chip.strong b{color:var(--blue)}

}
.words span.w{display:inline-block; white-space:nowrap; margin-right:.55em; color:var(--muted); border-bottom:2px solid transparent; padding-bottom:1px}
.words span.w.cur{color:var(--text); border-bottom-color:var(--blue)}
.words span.w.gata{color:var(--green); opacity:.65}
.words span.w.gres{color:var(--red); text-decoration:underline wavy var(--red)}
.words span.w.cur span.ok{color:var(--text)}
.caret{display:inline-block; width:2px; height:1.05em; background:var(--blue); vertical-align:-.15em; animation:clip 1s steps(1) infinite}

@media (prefers-reduced-motion: reduce){ .caret{animation:none; opacity:1} *{transition:none !important} }

var LIMBI = ["ro","en","sr","src"];
var CHEIE = "scrie-repede-v1";

/* ---------- stare ---------- */
var state = {
  lang:"ro", durata:30, seed:0, lista:[], idx:0, poz:0,
  bune:0, total:0, gresite:0, cuvinteGata:0,
  start:0, timer:null, rulare:false, gata:false, sursa:"",
  rezWpm:null, rezPrec:null, rezSec:0
};

function $(id){ return document.getElementById(id); }
function t(){ return L[state.lang]; }

/* ---------- PRNG cu seed, ca testele sa fie deterministe ---------- */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var x = Math.imul(a ^ a >>> 15, 1 | a);
    x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x;
    return ((x ^ x >>> 14) >>> 0) / 4294967296;
  };
}

function amesteca(lista){
  var rnd = mulberry32(state.seed), i, j, tmp;
  for(i = lista.length - 1; i > 0; i--){
    j = Math.floor(rnd() * (i + 1));
    tmp = lista[i]; lista[i] = lista[j]; lista[j] = tmp;
  }
  return lista;
}

function toateCuvintele(lang){
  var teme = W[lang], out = [], k;
  for(k in teme) if(Object.prototype.hasOwnProperty.call(teme, k)) out = out.concat(teme[k]);
  return out;
}

/* ---------- parametri din URL: ?s=30 & ?seed=7 & ?n=40 & ?limba=en ---------- */
function dinUrl(){
  var q = new URLSearchParams(location.search);
  if(q.has("limba") && LIMBI.indexOf(q.get("limba")) >= 0) state.lang = q.get("limba");
  var s = parseInt(q.get("s"), 10);
  if(s >= 5 && s <= 300) state.durata = s;
  var n = parseInt(q.get("n"), 10);
  state.nCuvinte = (n >= 1 && n <= 200) ? n : 40;
  state.seed = parseInt(q.get("seed"), 10) || 1;
  state.sursa = q.toString();
}

/* ---------- pregatirea rundei ---------- */
function pregateste(){
  var piscina = amesteca(toateCuvintele(state.lang).slice());
  var lista = [], i = 0;
  while(lista.length < state.nCuvinte){
    lista.push(piscina[i % piscina.length]);
    i++;
  }
  state.lista = lista;
  state.idx = 0;
  state.poz = 0;
  state.bune = 0;
  state.total = 0;
  state.gresite = 0;
  state.cuvinteGata = 0;
  state.gata = false;
  state.rulare = false;
  state.rezWpm = null;
  state.rezPrec = null;
  state.rezSec = 0;
  if(state.timer){ window.clearInterval(state.timer); state.timer = null; }
  $("rezultat").className = "rezultat";
  deseneaza();
  actualizeazaChips();
  mesaj(t().binevenit, "");
}

function deseneaza(){
  var cutie = $("words");
  cutie.textContent = "";
  var deLa = Math.max(0, state.idx - 1);
  var panaLa = Math.min(state.lista.length, deLa + 18);
  for(var i = deLa; i < panaLa; i++){
    var w = document.createElement("span");
    w.className = "w";
    if(i < state.idx) w.className += " gata";
    if(i === state.idx) w.className += " cur";
    if(i === state.idx){
      var scris = state.lista[i].slice(0, state.poz);
      if(scris) w.appendChild(document.createTextNode(scris));
      var cursor = document.createElement("span");
      cursor.className = "caret";
      w.appendChild(cursor);
      w.appendChild(document.createTextNode(state.lista[i].slice(state.poz)));
    } else {
      w.textContent = state.lista[i];
    }
    cutie.appendChild(w);
  }
}

function mesaj(text, fel){
  var m = $("msg");
  m.textContent = text;
  m.className = "msg" + (fel ? " " + fel : "");
}

function wpm(){
  if(state.rezWpm !== null && !state.rulare) return state.rezWpm;   // runda s-a terminat: cifra inghetata
  if(!state.start) return 0;
  var minute = (Date.now() - state.start) / 60000;
  if(minute <= 0) return 0;
  return Math.round((state.bune / 5) / minute);
}

function precizie(){
  if(state.rezPrec !== null && !state.rulare) return state.rezPrec;
  if(state.total === 0) return 100;
  return Math.round(100 * state.bune / state.total);
}

function actualizeazaChips(){
  $("wpmChip").textContent = state.rulare || state.gata ? wpm() : 0;
  $("precChip").textContent = precizie();
  $("cuvChip").textContent = state.cuvinteGata;
  var ramas = state.durata * 1000 - (state.rulare ? Date.now() - state.start : 0);
  if(ramas < 0) ramas = 0;
  $("timpChip").textContent = mmss(ramas);
  var fract = state.rulare ? Math.max(0, ramas / (state.durata * 1000)) : 1;
  $("progresBara").style.transform = "scaleX(" + fract.toFixed(4) + ")";
}

function mmss(ms){
  var s = Math.ceil(ms / 1000);
  return Math.floor(s / 60) + ":" + ("0" + (s % 60)).slice(-2);
}

function porneste(){
  if(state.rulare) return;
  pregateste();
  state.rulare = true;
  state.start = Date.now();
  mesaj(t().scrie + state.lista[0], "");
  $("inputAscuns").focus({ preventScroll: true });
  var ultimul = 0;
  state.timer = window.setInterval(function(){
    var acum = Date.now();
    if(acum - ultimul >= 200){ actualizeazaChips(); ultimul = acum; }
    if(acum - state.start >= state.durata * 1000) termina(t().oprit);
  }, 100);
  actualizeazaChips();
  deseneaza();
}

function termina(motiv){
  if(!state.rulare) return;
  state.rulare = false;
  state.gata = true;
  if(state.timer){ window.clearInterval(state.timer); state.timer = null; }
  var w = wpm(), p = precizie();
  state.rezWpm = w;                    // de aici incolo cifrele nu se mai schimba
  state.rezPrec = p;
  state.rezSec = Math.max(1, Math.round((Date.now() - state.start) / 1000));
  actualizeazaChips();
  $("rezWpm").textContent = w;
  $("rezPrec").textContent = p;
  $("rezCuv").textContent = state.cuvinteGata;
  var nota = "";
  if(p < 90){
    nota = t().precaMica;
  } else {
    var record = recordCurent();
    if(w > record){ nota = t().record + w + " " + t().cuvLbl; salveazaRecord(w); }
    else if(record) nota = t().record + record + " " + t().cuvLbl;
  }
  $("rezNota").textContent = nota;
  $("rezultat").className = "rezultat aratat";
  mesaj(motiv || t().gata, "bine");
  $("startBtn").textContent = t().dinou;
}

function recordCurent(){
  try{
    var d = JSON.parse(localStorage.getItem(CHEIE) || "{}");
    return d.record || 0;
  }catch(e){ return 0; }
}

function salveazaRecord(w){
  try{
    localStorage.setItem(CHEIE, JSON.stringify({ record:w, limba:state.lang, la:Date.now() }));
  }catch(e){}
}

/* ---------- tastarea ---------- */
function literaCorecta(ch){
  if(!state.rulare || state.gata) return;
  var cuv = state.lista[state.idx];
  if(!cuv) return;
  if(ch.length !== 1) return;
  state.total++;
  if(ch.toUpperCase() === cuv.charAt(state.poz).toUpperCase()){
    state.bune++;
    state.poz++;
    if(state.poz >= cuv.length){
      state.cuvinteGata++;
      state.idx++;
      state.poz = 0;
      if(state.idx >= state.lista.length){ termina(t().gata); return; }
    }
    mesaj(t().scrie + state.lista[state.idx], "");
    deseneaza();
  } else {
    state.gresite++;
    mesaj(t().gresit, "rau");
    var cur = document.querySelector(".words .w.cur");
    if(cur){
      cur.className = "w cur gres";
      window.setTimeout(function(){ if(cur) cur.className = "w cur"; }, 220);
    }
  }
  actualizeazaChips();
}

/* ---------- interfata ---------- */
function aplicaLimba(lang, faraReset){
  state.lang = lang;
  document.documentElement.lang = t().htmlLang;
  document.title = t().titlu;
  $("titlu").textContent = t().nume;
  $("limbaBtn").textContent = t().btnLimba;
  $("startBtn").textContent = state.gata ? t().dinou : t().start;
  $("dinouBtn").textContent = t().dinou;
  $("copiazaBtn").textContent = t().copiaza;
  $("wpmLbl").textContent = t().cuvLbl;
  $("precLbl").textContent = t().precLbl;
  $("cuvLbl").textContent = t().cuvinteLbl;
  $("rezTitlu").textContent = t().gata;
  $("rezWpmLbl").textContent = t().rezWpm;
  $("rezPrecLbl").textContent = t().rezPrec;
  $("rezCuvLbl").textContent = t().rezCuv;
  $("ajutor").innerHTML = t().ajutor;
  $("foot").textContent = t().foot;
  $("supportText").textContent = t().supportText;
  $("supportLink").innerHTML = "❤️ <span>" + t().supportLink + "</span>";
  $("report").textContent = t().report;
  if(!faraReset) pregateste();
}

function initTema(){
  var salvat = null;
  try{ salvat = localStorage.getItem("games-theme"); }catch(e){}
  if(salvat === "dark" || salvat === "light") document.documentElement.setAttribute("data-theme", salvat);
  else if(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches)
    document.documentElement.setAttribute("data-theme", "dark");
}

function init(){
  dinUrl();
  initTema();
  document.querySelectorAll("[data-durata]").forEach(function(b){
    b.setAttribute("aria-pressed", String(parseInt(b.dataset.durata, 10) === state.durata));
    b.addEventListener("click", function(){
      state.durata = parseInt(b.dataset.durata, 10);
      document.querySelectorAll("[data-durata]").forEach(function(x){ x.setAttribute("aria-pressed", "false"); });
      b.setAttribute("aria-pressed", "true");
      pregateste();
    });
  });
  $("limbaBtn").addEventListener("click", function(){
    var i = LIMBI.indexOf(state.lang);
    aplicaLimba(LIMBI[(i + 1) % LIMBI.length]);
    var rot = document.querySelector('.words');
    if(rot) rot.setAttribute("aria-label", L[state.lang].scrie);
  });
  $("temăBtn").addEventListener("click", function(){
    var acum = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", acum);
    try{ localStorage.setItem("games-theme", acum); }catch(e){}
  });
  $("startBtn").addEventListener("click", porneste);
  $("dinouBtn").addEventListener("click", pregateste);
  $("copiazaBtn").addEventListener("click", function(){
    var text = t().nume + ": " + wpm() + " " + t().cuvLbl + ", " + precizie() + "% " + t().precLbl +
               ", " + (state.rezSec || state.durata) + "s\nhttps://games.freehtml.dev/typing-test/";
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){
        mesaj(t().copiat, "bine");
      }, function(){ mesaj(text, ""); });
    } else {
      mesaj(text, "");
    }
  });

  document.addEventListener("keydown", function(e){
    if(e.key === "Escape"){
      if(state.rulare){ termina(t().oprit); e.preventDefault(); }
      return;
    }
    if(e.key === "Enter" && !state.rulare){
      var activ = document.activeElement;
      if(activ && activ.tagName === "BUTTON" && activ.id !== "startBtn" && activ.id !== "dinouBtn") return;
      porneste();
      e.preventDefault();
      return;
    }
    if(!state.rulare) return;
    if(e.ctrlKey || e.metaKey || e.altKey) return;
    if(e.key === "Backspace"){ e.preventDefault(); return; }
    if(e.key === " "){ e.preventDefault(); return; }
    if(e.key.length === 1){
      e.preventDefault();
      literaCorecta(e.key);
    }
  });

  /* pe telefon, tastatura se deschide doar cu un input real */
  var ascuns = $("inputAscuns");
  ascuns.addEventListener("input", function(){
    var v = ascuns.value;
    if(v) literaCorecta(v.slice(-1));
    ascuns.value = "";
  });
  $("words").addEventListener("click", function(){ ascuns.focus({ preventScroll: true }); });

  aplicaLimba(state.lang, true);
  pregateste();
}

init();
</script>
</body>
</html>
