  }
}
html[data-theme="light"]{
  --bg:#f6f7fb; --panel:#ffffff; --panel2:#eef1f8; --text:#111827; --muted:#5b6472;
  --line:#d8dee9; --accent:#2563eb; --accent-soft:#dbe6ff; --good:#157f3c; --bad:#b3261e;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.08);
}
html[data-theme="dark"]{
  --bg:#0b1220; --panel:#111a2b; --panel2:#182338; --text:#e8edf6; --muted:#9aa7bd;
  --line:#26334b; --accent:#6b9dff; --accent-soft:#1b2c4d; --good:#4ade80; --bad:#ff7a70;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--text);
  font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:960px; margin:0 auto; padding:18px 16px 48px}
header{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:16px}
.brand{display:flex; align-items:center; gap:10px; font-weight:700; font-size:18px; letter-spacing:-.01em}
.dot{width:30px;height:30px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:17px;font-weight:800}
.spacer{flex:1}
.iconbtn{
  border:1px solid var(--line); background:var(--panel); color:var(--text);
  border-radius:10px; padding:8px 10px; cursor:pointer; font-size:15px; line-height:1;
}
.iconbtn:hover{border-color:var(--accent)}
/* link de intoarcere la hub-ul de jocuri */
.homebtn{
  display:inline-flex; align-items:center; gap:7px; text-decoration:none;
  border:1px solid var(--line); background:var(--panel); color:var(--text);
  border-radius:10px; padding:8px 12px; font-size:14px; font-weight:600; line-height:1;
}
.homebtn:hover{border-color:var(--accent); color:var(--accent)}
.homebtn:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.homebtn .arw{font-size:15px; line-height:1}

.langs{display:flex; gap:4px; background:var(--panel2); border:1px solid var(--line); border-radius:11px; padding:3px}
.langs button{
  border:0; background:transparent; color:var(--muted); font:inherit; font-size:13px; font-weight:600;
  padding:6px 9px; border-radius:8px; cursor:pointer;
}
.langs button[aria-pressed="true"]{background:var(--panel); color:var(--text); box-shadow:var(--shadow)}
.card{
  background:var(--panel); border:1px solid var(--line); border-radius:16px;
  box-shadow:var(--shadow); padding:18px; margin-bottom:16px;
}
.topline{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px}
.chip{
  font-size:13px; font-weight:600; color:var(--muted); background:var(--panel2);
  border:1px solid var(--line); border-radius:999px; padding:4px 11px;
}
.chip b{color:var(--text)}
.hang{display:block; margin:0 auto 10px; width:180px; height:190px}
.hang line,.hang circle{stroke:var(--text); stroke-width:4; stroke-linecap:round; fill:none}
.hang .base{stroke:var(--muted)}
.word{display:flex; flex-wrap:wrap; justify-content:center; gap:7px; margin:6px 0 18px; min-height:52px}
.letter{
  min-width:38px; height:48px; display:grid; place-items:center;
  border-bottom:3px solid var(--line); font-size:26px; font-weight:700; letter-spacing:.02em;
  background:var(--panel2); border-radius:8px 8px 0 0;
}
.letter.on{border-bottom-color:var(--accent)}
.letter.miss{border-bottom-color:var(--bad); color:var(--bad)}
.word.done .letter{border-bottom-color:var(--good)}
.kb{display:flex; flex-direction:column; gap:6px; align-items:center}
.krow{display:flex; gap:6px; justify-content:center; flex-wrap:wrap}
.key{
  min-width:38px; height:42px; padding:0 8px; border-radius:9px; cursor:pointer;
  border:1px solid var(--line); background:var(--panel2); color:var(--text);
  font:inherit; font-size:16px; font-weight:600; text-transform:uppercase;
}
.key:hover:not(:disabled){border-color:var(--accent)}
.key:disabled{opacity:.35; cursor:default}
.key.hit{background:var(--good); border-color:var(--good); color:#fff; opacity:1}
.key.miss{background:transparent; color:var(--muted); opacity:.5}
.key:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.msg{text-align:center; font-weight:600; min-height:26px; margin:14px 0 8px}
.msg.win{color:var(--good)} .msg.lose{color:var(--bad)}
.actions{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:8px}
.btn{
  border:1px solid var(--accent); background:var(--accent); color:#fff;
  border-radius:11px; padding:11px 18px; font:inherit; font-weight:700; cursor:pointer;
}
.btn.ghost{background:transparent; color:var(--text); border-color:var(--line)}
.btn:hover{filter:brightness(1.06)}
.stats{display:flex; gap:18px; justify-content:center; flex-wrap:wrap; margin-top:14px; color:var(--muted); font-size:14px}
.stats b{color:var(--text); font-size:17px; display:block; text-align:center}
.stats span{display:block; text-align:center}
h1{font-size:24px; letter-spacing:-.02em; margin:0 0 8px}
h2{font-size:18px; margin:22px 0 8px}
p{margin:0 0 12px; color:var(--muted)}
p strong{color:var(--text)}
.note{font-size:13px}
footer{color:var(--muted); font-size:13px; text-align:center; margin-top:28px; line-height:1.9}
footer a{color:var(--accent); text-decoration:none; font-weight:600}
footer a{display:inline-block; padding:5px 2px; min-height:24px; min-width:24px}
footer a:hover{text-decoration:underline}
footer .sep{opacity:.5; margin:0 4px}
@media (max-width:560px){
  header{gap:8px; margin-bottom:12px}
  .spacer{display:none}
  .brand{flex:1 1 auto; min-width:0}
  .langs{order:10; width:100%; justify-content:space-between}
  .langs button{flex:1}
  .iconbtn{margin-left:auto}
  .wrap{padding:12px 10px 32px}
  .brand{font-size:16px}
  .dot{width:26px;height:26px;border-radius:8px;font-size:15px}
  .card{padding:14px; border-radius:14px}
  .word{gap:4px; margin-bottom:14px; padding:0 2px}
  .letter{min-width:0; flex:1 1 auto; max-width:44px; height:40px; font-size:20px}
  .krow{gap:4px}
  .key{min-width:30px; height:40px; font-size:15px; padding:0 4px}
  .hang{width:132px; height:142px}
  .chip{font-size:12px; padding:3px 9px}
  .langs button{padding:6px 7px; font-size:12px}
  .btn{padding:10px 14px; font-size:15px}
  .stats{gap:12px; font-size:12px}
  .stats b{font-size:16px}
}
</style>

    mancare:["ПАЛАЧИНКЕ","КАЈМАК","ПРОЈА","ГИБАНИЦА","КОЛАЧ","ЧОРБА","ШТРУДЛА","ПЉЕСКАВИЦА","ПИТА","СИР","МЕД","САЛАТА","СУПА","КРОФНА","АЈВАР","ПЕЦИВО"],
    locuri:["ТВРЂАВА","МОСТ","МУЗЕЈ","БИБЛИОТЕКА","ШУМА","ЏАМИЈА","ПЛАНИНА","ОСТРВО","БАШТА","ГАРА","ПИЈАЦА","ЦРКВА","ТУНЕЛ","ФАБРИКА","ШКОЛА","БОЛНИЦА"]
  }
};

var MAX_LIVES = 6;
var KEY = "guess-the-word-v1";

var $ = function(id){ return document.getElementById(id); };

var state = {
  lang:"en",
  theme:"animale",
  word:"",
  guessed:{},     /* litera -> true */
  wrong:0,
  hints:0,
  score:0,
  over:false,
  stats:{ro:{p:0,w:0,s:0,b:0},en:{p:0,w:0,s:0,b:0},sr:{p:0,w:0,s:0,b:0},src:{p:0,w:0,s:0,b:0}}
};

/* ---------- persistenta ---------- */
function load(){
  state.lang = "en";              /* limba principala: engleza (regula 29.10.2026) */
  try{
    var raw = localStorage.getItem(KEY);
    if(!raw) return;
    var d = JSON.parse(raw);
    if(d && d.stats){
      for(var k in state.stats){
        if(d.stats[k]) state.stats[k] = {
          p:+d.stats[k].p||0, w:+d.stats[k].w||0, s:+d.stats[k].s||0, b:+d.stats[k].b||0
        };
      }
    }
    if(d && d.lang && L[d.lang]) state.lang = d.lang;
    if(d && d.theme && W[state.lang][d.theme]) state.theme = d.theme;
  }catch(e){}
}
function save(){
  try{
    localStorage.setItem(KEY, JSON.stringify({stats:state.stats, lang:state.lang, theme:state.theme}));
  }catch(e){}
}

/* ---------- tema light/dark ---------- */
function applyTheme(t){
  if(t){ document.documentElement.setAttribute("data-theme", t); }
  else { document.documentElement.removeAttribute("data-theme"); }
}
function initTheme(){
  var saved = null;
  try{ saved = localStorage.getItem(KEY + "-theme"); }catch(e){}
  applyTheme(saved);
  $("themeBtn").addEventListener("click", function(){
    var cur = document.documentElement.getAttribute("data-theme");
    var dark = cur ? cur === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    var next = dark ? "light" : "dark";
    applyTheme(next);
    try{ localStorage.setItem(KEY + "-theme", next); }catch(e){}
  });
}

/* ---------- texte ---------- */
function t(){ return L[state.lang]; }

/* link de intoarcere la hub - textul se schimba o data cu limba */
var HOME_LBL = {ro:"Jocuri", en:"Games", sr:"Igre", src:"Игре"};
var HOME_TTL = {ro:"Inapoi la toate jocurile", en:"Back to all games",
                sr:"Nazad na sve igre", src:"Назад на све игре"};
function applyHome(){
  var a = $("homeBtn"), l = $("homeLbl");
  if(!a || !l) return;
  l.textContent = HOME_LBL[state.lang] || "Games";
  a.setAttribute("aria-label", HOME_TTL[state.lang] || "Back to all games");
  a.setAttribute("title", HOME_TTL[state.lang] || "Back to all games");
}

function applyTexts(){
  var d = t();
  applyHome();
  document.documentElement.lang = d.htmlLang;
  document.title = d.title;
  var m = document.querySelector('meta[name="description"]');
  if(m) m.setAttribute("content", d.desc);
  $("brandName").textContent = d.name;
  $("againBtn").textContent = d.again;
  $("hintBtn").textContent = d.hint;
  $("stPlayedL").textContent = d.played;
  $("stWonL").textContent = d.won;
  $("stStreakL").textContent = d.streak;
  $("stBestL").textContent = d.best;
  $("h1").textContent = d.h1;
  $("p1").textContent = d.p1;
  $("h2").textContent = d.h2;
  $("p2").textContent = d.p2;
  $("p3").textContent = d.p3;
  $("foot").textContent = d.foot;
  $("supportText").textContent = d.supportText + " ";
  $("supportLink").querySelector("span").textContent = d.supportLink;
  $("report").textContent = d.report;
  var btns = document.querySelectorAll(".langs button");
  for(var i=0;i<btns.length;i++){
    btns[i].setAttribute("aria-pressed", btns[i].getAttribute("data-lang") === state.lang ? "true" : "false");
  }
}

/* ---------- desen ---------- */
function drawParts(){
  for(var i=1;i<=MAX_LIVES;i++){
    $("part"+i).style.display = (i <= state.wrong) ? "" : "none";
  }
}

function renderWord(){
  var box = $("word");
  box.innerHTML = "";
  box.className = "word" + (state.over && isWon() ? " done" : "");
  for(var i=0;i<state.word.length;i++){
    var ch = state.word[i];
    var el = document.createElement("div");
    var shown = state.guessed[ch] || state.over;
    el.className = "letter" + (state.guessed[ch] ? " on" : "") + ((state.over && !state.guessed[ch]) ? " miss" : "");
    el.textContent = shown ? ch : "";
    box.appendChild(el);
  }
}

function renderKeyboard(){
  var abc = ABC[state.lang];
  var kb = $("kb");
  kb.innerHTML = "";
  /* numarul de coloane se adapteaza la latimea ecranului */
  var w = window.innerWidth || 900;
  var per = w < 380 ? 7 : (w < 460 ? 8 : (w < 620 ? 9 : 11));
  for(var i=0;i<abc.length;i+=per){
    var row = document.createElement("div");
    row.className = "krow";
    for(var j=i;j<i+per && j<abc.length;j++){
      var ch = abc[j];
      var b = document.createElement("button");
      b.className = "key";
      b.type = "button";
      b.textContent = ch;
      b.setAttribute("data-k", ch);
      if(state.guessed[ch] === true){ b.className += " hit"; b.disabled = true; }
      else if(state.guessed[ch] === false){ b.className += " miss"; b.disabled = true; }
      b.addEventListener("click", (function(c){ return function(){ guess(c); }; })(ch));
      row.appendChild(b);
    }
    kb.appendChild(row);
  }
}

function renderChips(){
  var d = t();
  $("themeChip").innerHTML = d.cats[state.theme];
  $("livesChip").innerHTML = d.lives + ": <b>" + (MAX_LIVES - state.wrong) + "</b>";
  $("scoreChip").textContent = d.score + ": " + state.score;
  var s = state.stats[state.lang];
  $("stPlayed").textContent = s.p;
  $("stWon").textContent = s.w;
  $("stStreak").textContent = s.s;
  $("stBest").textContent = s.b;
}

/* ---------- logica ---------- */
function isWon(){
  for(var i=0;i<state.word.length;i++){
    if(!state.guessed[state.word[i]]) return false;
  }
  return true;
}

function pickWord(){
  var list = W[state.lang][state.theme];
  /* scoatem cuvantul curent din variante, ca sa nu repete si sa nu se blocheze */
  var pool = list.filter(function(w){ return w !== state.word; });
  if(!pool.length) pool = list;
  return pool[Math.floor(Math.random()*pool.length)];
}

function newGame(){
  state.word = pickWord();
  state.guessed = {};
  state.wrong = 0;
  state.hints = 0;
  state.over = false;
  $("msg").textContent = "";
  $("msg").className = "msg";
  drawParts();
  renderKeyboard();
  renderWord();
  renderChips();
  $("hintBtn").disabled = false;
}

function guess(ch){
  if(state.over) return;
  if(state.guessed[ch] !== undefined) return;
  var inWord = state.word.indexOf(ch) !== -1;
  state.guessed[ch] = inWord;
  if(!inWord) state.wrong++;
  renderKeyboard();
  renderWord();
  renderChips();
  drawParts();
  checkEnd();
}

function checkEnd(){
  var d = t();
  if(isWon()){
    state.over = true;
    state.score += Math.max(1, (MAX_LIVES - state.wrong) - state.hints);
    var s = state.stats[state.lang];
    s.p++; s.w++; s.s++;
    if(s.s > s.b) s.b = s.s;
    save();
    $("msg").textContent = d.win + state.word;
    $("msg").className = "msg win";
    renderWord();
    renderChips();
    return;
  }
  if(state.wrong >= MAX_LIVES){
    state.over = true;
    var s2 = state.stats[state.lang];
    s2.p++; s2.s = 0;
    save();
    $("msg").textContent = d.lose + state.word;
    $("msg").className = "msg lose";
    renderWord();
    renderChips();
    return;
  }
  /* litera gresita - feedback scurt */
  $("msg").textContent = "";
}

function revealHint(){
  if(state.over) return;
  var d = t();
  var hidden = [];
  for(var i=0;i<state.word.length;i++){
    var ch = state.word[i];
    if(state.guessed[ch] === undefined) hidden.push(ch);
  }
  if(!hidden.length){
    $("msg").textContent = d.hintNone;
    return;
  }
  var ch = hidden[Math.floor(Math.random()*hidden.length)];
  state.hints++;
  state.guessed[ch] = true;
  renderKeyboard();
  renderWord();
  checkEnd();
}

/* ---------- schimbare limba / tema ---------- */
function setLang(l){
  if(!L[l]) return;
  state.lang = l;
  if(!W[l][state.theme]) state.theme = "animale";
  applyTexts();
  newGame();
  save();
}

function cycleTheme(){
  var keys = Object.keys(W[state.lang]);
  var i = keys.indexOf(state.theme);
  state.theme = keys[(i+1) % keys.length];
  newGame();
  save();
}

/* ---------- start ---------- */
load();
applyTexts();
initTheme();
state.theme = Object.keys(W[state.lang]).indexOf(state.theme) >= 0 ? state.theme : "animale";
newGame();

$("againBtn").addEventListener("click", newGame);
$("hintBtn").addEventListener("click", revealHint);
$("themeChip").addEventListener("click", cycleTheme);
$("themeChip").style.cursor = "pointer";
$("themeChip").setAttribute("title", "Next theme");

var langBtns = document.querySelectorAll(".langs button");
for(var i=0;i<langBtns.length;i++){
  langBtns[i].addEventListener("click", (function(b){ return function(){ setLang(b.getAttribute("data-lang")); }; })(langBtns[i]));
}

var lastW = window.innerWidth;
window.addEventListener("resize", function(){
  var w = window.innerWidth;
  if((w < 620) !== (lastW < 620) || Math.abs(w - lastW) > 80){
    lastW = w;
    if(typeof renderKeyboard === "function") renderKeyboard();
  }
});

document.addEventListener("keydown", function(e){
  if(e.key === "Enter" && state.over){ newGame(); return; }
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  if(e.key.length !== 1) return;
  var ch = e.key.toUpperCase();
  if(ABC[state.lang].indexOf(ch) !== -1){
    e.preventDefault();
    guess(ch);
  }
});

})();
</script>
</body>
</html>
