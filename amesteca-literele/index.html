.chip.click{cursor:pointer}
.chip.click:hover{border-color:var(--accent)}
.chip b{color:var(--text)}
.slots{display:flex; flex-wrap:wrap; justify-content:center; gap:7px; margin:6px 0 22px; min-height:56px}
.slot{

.slot.bad{border-bottom-color:var(--bad); color:var(--bad)}

.rack{display:flex; flex-wrap:wrap; justify-content:center; gap:7px; margin:0 0 6px}
.rack .tile{

        };
      }
    }
    if(d && d.lang && L[d.lang]) state.lang = d.lang;
    if(d && d.theme && W[state.lang][d.theme]) state.theme = d.theme;
  }catch(e){}
}
function save(){
  try{
    localStorage.setItem(KEY, JSON.stringify({stats:state.stats, lang:state.lang, theme:state.theme}));
  }catch(e){}
}

/* ---------- tema light/dark ---------- */
function applyTheme(t){
  if(t){ document.documentElement.setAttribute("data-theme", t); }
  else { document.documentElement.removeAttribute("data-theme"); }
}
function initTheme(){
  var saved = null;
  try{ saved = localStorage.getItem(KEY + "-theme"); }catch(e){}
  applyTheme(saved);
  $("themeBtn").addEventListener("click", function(){
    var cur = document.documentElement.getAttribute("data-theme");
    var dark = cur ? cur === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    var next = dark ? "light" : "dark";
    applyTheme(next);
    try{ localStorage.setItem(KEY + "-theme", next); }catch(e){}
  });
}

/* ---------- texte ---------- */
function t(){ return L[state.lang]; }

/* link de intoarcere la hub - textul se schimba o data cu limba */
var HOME_LBL = {ro:"Jocuri", en:"Games", sr:"Igre", src:"Игре"};
var HOME_TTL = {ro:"Inapoi la toate jocurile", en:"Back to all games",
                sr:"Nazad na sve igre", src:"Назад на све игре"};
function applyHome(){
  var a = $("homeBtn"), l = $("homeLbl");
  if(!a || !l) return;
  l.textContent = HOME_LBL[state.lang] || "Games";
  a.setAttribute("aria-label", HOME_TTL[state.lang] || "Back to all games");
  a.setAttribute("title", HOME_TTL[state.lang] || "Back to all games");
}

function applyTexts(){
  var d = t();
  applyHome();
  document.documentElement.lang = d.htmlLang;
  document.title = d.title;
  var m = document.querySelector('meta[name="description"]');
  if(m) m.setAttribute("content", d.desc);
  $("brandName").textContent = d.name;
  $("againBtn").textContent = d.again;
  $("hintBtn").textContent = d.hint;
  $("clearBtn").textContent = d.clear;
  $("stPlayedL").textContent = d.played;
  $("stWonL").textContent = d.won;
  $("stStreakL").textContent = d.streak;
  $("stBestL").textContent = d.best;
  $("h1").textContent = d.h1;
  $("p1").textContent = d.p1;
  $("h2").textContent = d.h2;
  $("p2").textContent = d.p2;
  $("p3").textContent = d.p3;
  $("foot").textContent = d.foot;
  $("supportText").textContent = d.supportText + " ";
  $("supportLink").querySelector("span").textContent = d.supportLink;
  $("report").textContent = d.report;
  var btns = document.querySelectorAll(".langs button");
  for(var i=0;i<btns.length;i++){
    btns[i].setAttribute("aria-pressed", btns[i].getAttribute("data-lang") === state.lang ? "true" : "false");
  }
}

/* ---------- joc ---------- */
function shuffle(a){
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var x = a[i]; a[i] = a[j]; a[j] = x;
  }
  return a;
}

function buildRack(word){
  var litere = word.split("");
  var amestec = shuffle(litere.slice());
  /* daca din întâmplare iese exact cuvântul, mai amestecăm o dată */
  var incercari = 0;
  while(amestec.join("") === word && incercari < 12){
    amestec = shuffle(litere.slice());
    incercari++;
  }
  return amestec.map(function(ch){ return { ch:ch, used:false }; });
}

function pickWord(){
  var list = W[state.lang][state.theme];
  var pool = list.filter(function(w){ return w !== state.word; });
  if(!pool.length) pool = list;
  return pool[Math.floor(Math.random()*pool.length)];
}

function newGame(){
  state.word = pickWord();
  state.rack = buildRack(state.word);
  state.slots = new Array(state.word.length).fill(null);
  state.hinted = [];
  state.over = false;
  state.busy = false;
  $("slots").className = "slots";
  $("msg").textContent = "";
  $("msg").className = "msg";
  $("hintBtn").disabled = false;
  $("clearBtn").disabled = false;
  render();
}

function render(){
  var d = t();

  /* sloturi */
  var box = $("slots");
  box.innerHTML = "";
  box.className = "slots" + (state.over ? " done" : "");
  for(var i=0;i<state.slots.length;i++){
    var b = document.createElement("button");
    b.type = "button";
    b.className = "slot";
    var ri = state.slots[i];
    if(ri !== null){
      b.className += " filled";
      if(state.hinted.indexOf(i) !== -1) b.className += " hinted";
      b.textContent = state.rack[ri].ch;
      b.setAttribute("aria-label", state.rack[ri].ch);
      b.addEventListener("click", (function(pos){ return function(){ takeOut(pos); }; })(i));
    } else {
      b.setAttribute("aria-label", "?");
      b.textContent = "";
      b.disabled = true;
    }
    box.appendChild(b);
  }

  /* literele amestecate */
  var rack = $("rack");
  rack.innerHTML = "";
  for(var j=0;j<state.rack.length;j++){
    var t2 = document.createElement("button");
    t2.type = "button";
    t2.className = "tile";
    t2.textContent = state.rack[j].ch;
    t2.setAttribute("data-k", state.rack[j].ch);
    t2.disabled = state.rack[j].used || state.over;
    if(!t2.disabled){
      t2.addEventListener("click", (function(idx){ return function(){ place(idx); }; })(j));
    }
    rack.appendChild(t2);
  }

  /* chip-uri si statistici */
  $("themeChip").textContent = d.cats[state.theme];
  $("lenChip").textContent = state.word.length + " " + d.letters;
  $("scoreChip").textContent = d.score + ": " + state.score;
  var s = state.stats[state.lang];
  $("stPlayed").textContent = s.p;
  $("stWon").textContent = s.w;
  $("stStreak").textContent = s.s;
  $("stBest").textContent = s.b;
}

function firstEmpty(){
  for(var i=0;i<state.slots.length;i++) if(state.slots[i] === null) return i;
  return -1;
}

function place(idx){
  if(state.over || state.busy) return;
  if(state.rack[idx].used) return;
  var slot = firstEmpty();
  if(slot === -1) return;
  state.rack[idx].used = true;
  state.slots[slot] = idx;
  state.hinted = state.hinted.filter(function(p){ return p !== slot; });
  render();
  check();
}

function takeOut(pos){
  if(state.over || state.busy) return;
  var ri = state.slots[pos];
  if(ri === null) return;
  state.rack[ri].used = false;
  state.slots[pos] = null;
  state.hinted = state.hinted.filter(function(p){ return p !== pos; });
  render();
}

function clearAll(){
  if(state.over) return;
  state.busy = false;
  $("slots").className = "slots";
  for(var i=0;i<state.slots.length;i++){
    if(state.slots[i] !== null){
      state.rack[state.slots[i]].used = false;
      state.slots[i] = null;
    }
  }
  state.hinted = [];
  $("msg").textContent = "";
  $("msg").className = "msg";
  render();
}

function current(){
  var out = "";
  for(var i=0;i<state.slots.length;i++){
    out += state.slots[i] === null ? "?" : state.rack[state.slots[i]].ch;
  }
  return out;
}

function check(){
  if(firstEmpty() !== -1) return;
  var d = t();
  if(current() === state.word){
    state.over = true;
    var castig = Math.max(1, state.word.length - state.hinted.length);
    state.score += castig;
    var s = state.stats[state.lang];
    s.p++; s.w++; s.s++;
    if(s.s > s.b) s.b = s.s;
    save();
    $("msg").textContent = d.win + state.word;
    $("msg").className = "msg win";
    $("hintBtn").disabled = true;
    $("clearBtn").disabled = true;
    render();
    return;
  }
  /* nu e bine: scuturăm și lăsăm literele pe loc, ca să poți scoate */
  state.busy = true;
  $("msg").textContent = d.shake;
  $("msg").className = "msg bad";
  $("slots").className = "slots shake";
  setTimeout(function(){
    state.busy = false;
    $("slots").className = "slots";
  }, 650);
  var s2 = state.stats[state.lang];
  /* o încercare greșită nu încheie jocul, dar rupe seria */
  if(s2.s !== 0){ s2.s = 0; save(); }
  render();
}

function revealHint(){
  if(state.over || state.busy) return;
  var d = t();
  var slot = firstEmpty();
  if(slot === -1){
    /* toate plin dar greșit: scoatem întâi pozitiile greșite si aratam urmatoarea */
    for(var i=0;i<state.slots.length;i++){
      var ri = state.slots[i];
      if(ri !== null && state.rack[ri].ch !== state.word[i] && state.hinted.indexOf(i) === -1){
        slot = i;
        break;
      }
    }
    if(slot === -1){ $("msg").textContent = d.hintNone; return; }
  }
  var litera = state.word[slot];
  /* cautam o litera nefolosita care se potriveste */
  var gasit = -1;
  for(var j=0;j<state.rack.length;j++){
    if(!state.rack[j].used && state.rack[j].ch === litera){ gasit = j; break; }
  }
  if(gasit === -1){
    /* nu exista: luam orice litera libera si o transformam */
    for(var k=0;k<state.rack.length;k++){
      if(!state.rack[k].used){ gasit = k; state.rack[k].ch = litera; break; }
    }
  }
  if(gasit === -1){ $("msg").textContent = d.hintNone; return; }
  /* daca slotul era ocupat cu altceva, eliberam litera veche */
  if(state.slots[slot] !== null) state.rack[state.slots[slot]].used = false;
  state.rack[gasit].used = true;
  state.slots[slot] = gasit;
  if(state.hinted.indexOf(slot) === -1) state.hinted.push(slot);
  $("msg").textContent = "";
  $("msg").className = "msg";
  render();
  check();
}

/* ---------- limba / tema ---------- */
function setLang(l){
  if(!L[l]) return;
  state.lang = l;
  if(!W[l][state.theme]) state.theme = "animale";
  applyTexts();
  newGame();
  save();
}

function cycleTheme(){
  var keys = Object.keys(W[state.lang]);
  var i = keys.indexOf(state.theme);
  state.theme = keys[(i+1) % keys.length];
  newGame();
  save();
}

/* ---------- start ---------- */
load();
applyTexts();
initTheme();
state.theme = Object.keys(W[state.lang]).indexOf(state.theme) >= 0 ? state.theme : "animale";
newGame();

$("againBtn").addEventListener("click", newGame);
$("hintBtn").addEventListener("click", revealHint);
$("clearBtn").addEventListener("click", clearAll);
$("themeChip").addEventListener("click", cycleTheme);

var langBtns = document.querySelectorAll(".langs button");
for(var i=0;i<langBtns.length;i++){
  langBtns[i].addEventListener("click", (function(b){ return function(){ setLang(b.getAttribute("data-lang")); }; })(langBtns[i]));
}

document.addEventListener("keydown", function(e){
  if(e.key === "Enter"){
    /* Enter nu trebuie sa apese si butonul care are focusul */
    e.preventDefault();
    if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
    newGame();
    return;
  }
  if(e.key === "Backspace"){
    e.preventDefault();
    for(var i=state.slots.length-1;i>=0;i--){
      if(state.slots[i] !== null){ takeOut(i); return; }
    }
    return;
  }
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  if(e.key.length !== 1) return;

  var ch = e.key.toUpperCase();
  /* potrivire exacta intai (pentru diacritice), apoi fara diacritice */
  var gol = function(s){ return s.normalize("NFD").replace(/[\u0300-\u036f]/g, ""); };
  var idx = -1;
  for(var j=0;j<state.rack.length;j++){
    if(!state.rack[j].used && state.rack[j].ch === ch){ idx = j; break; }
  }
  if(idx === -1){
    for(var k=0;k<state.rack.length;k++){
      if(!state.rack[k].used && gol(state.rack[k].ch) === gol(ch)){ idx = k; break; }
    }
  }
  if(idx !== -1){ e.preventDefault(); place(idx); }
});

})();
</script>
