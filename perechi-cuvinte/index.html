:root{

  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.08);
  --back1:#2563eb; --back2:#1e40af;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0b1220; --panel:#111a2b; --panel2:#182338; --text:#e8edf6; --muted:#9aa7bd;
    --line:#26334b; --accent:#6b9dff; --accent-soft:#1b2c4d; --good:#4ade80; --bad:#ff7a70;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
    --back1:#2b4b8f; --back2:#16233d;
  }
}
html[data-theme="light"]{
  --bg:#f6f7fb; --panel:#ffffff; --panel2:#eef1f8; --text:#111827; --muted:#5b6472;
  --line:#d8dee9; --accent:#2563eb; --accent-soft:#dbe6ff; --good:#157f3c; --bad:#b3261e;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.08);
  --back1:#2563eb; --back2:#1e40af;
}
html[data-theme="dark"]{
  --bg:#0b1220; --panel:#111a2b; --panel2:#182338; --text:#e8edf6; --muted:#9aa7bd;
  --line:#26334b; --accent:#6b9dff; --accent-soft:#1b2c4d; --good:#4ade80; --bad:#ff7a70;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  --back1:#2b4b8f; --back2:#16233d;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--text);
  font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:960px; margin:0 auto; padding:18px 16px 48px}
header{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:16px}
.brand{display:flex; align-items:center; gap:10px; font-weight:700; font-size:18px; letter-spacing:-.01em}
.dot{width:30px;height:30px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center}
.dot svg{display:block}
.spacer{flex:1}
.iconbtn{
  border:1px solid var(--line); background:var(--panel); color:var(--text);
  border-radius:10px; padding:8px 10px; cursor:pointer; font-size:15px; line-height:1;
}
.iconbtn:hover{border-color:var(--accent)}
/* link de intoarcere la hub-ul de jocuri */
.homebtn{
  display:inline-flex; align-items:center; gap:7px; text-decoration:none;
  border:1px solid var(--line); background:var(--panel); color:var(--text);
  border-radius:10px; padding:8px 12px; font-size:14px; font-weight:600; line-height:1;
}
.homebtn:hover{border-color:var(--accent); color:var(--accent)}
.homebtn:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.homebtn .arw{font-size:15px; line-height:1}

.langs{display:flex; gap:4px; background:var(--panel2); border:1px solid var(--line); border-radius:11px; padding:3px}
.langs button{
  border:0; background:transparent; color:var(--muted); font:inherit; font-size:13px; font-weight:600;
  padding:6px 9px; border-radius:8px; cursor:pointer;
}
.langs button[aria-pressed="true"]{background:var(--panel); color:var(--text); box-shadow:var(--shadow)}
.card{
  background:var(--panel); border:1px solid var(--line); border-radius:16px;
  box-shadow:var(--shadow); padding:18px; margin-bottom:16px;
}
.topline{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:14px}
.chip{
  font-size:13px; font-weight:600; color:var(--muted); background:var(--panel2);
  border:1px solid var(--line); border-radius:999px; padding:4px 11px;
}
.chip.click{cursor:pointer}
.chip.click:hover{border-color:var(--accent)}
.chip b{color:var(--text)}
.board{
  display:grid; gap:8px; margin:0 auto 8px; max-width:640px;
  grid-template-columns:repeat(4,minmax(0,1fr));
}
.board.p4{max-width:420px}
.board.p8{max-width:720px}
.tile{
  position:relative; aspect-ratio:1/.82; border:0; padding:0; background:transparent;
  cursor:pointer; perspective:900px; -webkit-tap-highlight-color:transparent;
}
.tile:disabled{cursor:default}
.face{
  position:absolute; inset:0; border-radius:12px; display:grid; place-items:center;
  padding:4px; text-align:center; overflow:hidden;
  transition:transform .32s cubic-bezier(.2,.7,.3,1), opacity .2s;
  backface-visibility:hidden; -webkit-backface-visibility:hidden;
  font-weight:700; letter-spacing:.01em; line-height:1.15; word-break:break-word; hyphens:auto;
}
.face.back{
  background:linear-gradient(150deg,var(--back1),var(--back2));
  color:rgba(255,255,255,.86); font-size:22px; border:1px solid rgba(255,255,255,.16);
}
.face.front{
  background:var(--panel2); color:var(--text); border:1px solid var(--line);
  transform:rotateY(180deg); box-shadow:var(--shadow);
}
.tile.open .face.back{transform:rotateY(-180deg)}
.tile.open .face.front{transform:rotateY(0)}
.tile.done .face.front{border-color:var(--good); background:color-mix(in srgb,var(--good) 16%,var(--panel2)); color:var(--good)}
.tile.done{cursor:default}
.tile:focus-visible{outline:3px solid var(--accent); outline-offset:3px; border-radius:14px}
.msg{text-align:center; font-weight:600; min-height:26px; margin:14px 0 8px}
.msg.win{color:var(--good)}
.actions{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:8px}
.btn{
  border:1px solid var(--accent); background:var(--accent); color:#fff;
  border-radius:11px; padding:11px 18px; font:inherit; font-weight:700; cursor:pointer;
}
.btn.ghost{background:transparent; color:var(--text); border-color:var(--line)}
.btn:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.45; cursor:default; filter:none}
.stats{display:flex; gap:18px; justify-content:center; flex-wrap:wrap; margin-top:14px; color:var(--muted); font-size:14px}
.stats b{color:var(--text); font-size:17px; display:block; text-align:center}
.stats span{display:block; text-align:center}
h1{font-size:24px; letter-spacing:-.02em; margin:0 0 8px}
h2{font-size:18px; margin:22px 0 8px}
p{margin:0 0 12px; color:var(--muted)}
p strong{color:var(--text)}
.note{font-size:13px}
footer{color:var(--muted); font-size:13px; text-align:center; margin-top:28px; line-height:1.9}
footer a{color:var(--accent); text-decoration:none; font-weight:600}
footer a:hover{text-decoration:underline}
footer .sep{opacity:.5; margin:0 4px}
@media (max-width:560px){
  header{gap:8px; margin-bottom:12px}
  .spacer{display:none}
  .brand{flex:1 1 auto; min-width:0; font-size:16px}
  .langs{order:10; width:100%; justify-content:space-between}
  .langs button{flex:1; padding:6px 7px; font-size:12px}
  .iconbtn{margin-left:auto}
  .wrap{padding:12px 10px 32px}
  .dot{width:26px;height:26px;border-radius:8px;font-size:13px}
  .card{padding:14px; border-radius:14px}
  .board{grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px}
  .board.p8{grid-template-columns:repeat(4,minmax(0,1fr))}
  .face{border-radius:10px}
  .face.back{font-size:18px}
  .chip{font-size:12px; padding:3px 9px}
  .btn{padding:10px 14px; font-size:15px}
  .stats{gap:12px; font-size:12px}
  .stats b{font-size:16px}
}
@media (prefers-reduced-motion: reduce){
  .face{transition:none}
}
</style>
</head>

};

/* ---------- persistenta ---------- */
function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(!raw) return;
    var d = JSON.parse(raw);
    if(d && d.stats){
      for(var k in state.stats){
        if(d.stats[k]) state.stats[k] = {
          p:+d.stats[k].p||0, w:+d.stats[k].w||0, s:+d.stats[k].s||0, b:+d.stats[k].b||0
        };
      }
    }
    if(d && d.lang && L[d.lang]) state.lang = d.lang;
    if(d && d.theme && W[state.lang][d.theme]) state.theme = d.theme;
    if(d && SIZES.indexOf(+d.pairs) !== -1) state.pairs = +d.pairs;
  }catch(e){}
}
function save(){
  try{
    localStorage.setItem(KEY, JSON.stringify({
      stats:state.stats, lang:state.lang, theme:state.theme, pairs:state.pairs
    }));
  }catch(e){}
}

/* ---------- tema light/dark ---------- */
function applyTheme(t){
  if(t){ document.documentElement.setAttribute("data-theme", t); }
  else { document.documentElement.removeAttribute("data-theme"); }
}
function initTheme(){
  var saved = null;
  try{ saved = localStorage.getItem(KEY + "-theme"); }catch(e){}
  applyTheme(saved);
  $("themeBtn").addEventListener("click", function(){
    var cur = document.documentElement.getAttribute("data-theme");
    var dark = cur ? cur === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    var next = dark ? "light" : "dark";
    applyTheme(next);
    try{ localStorage.setItem(KEY + "-theme", next); }catch(e){}
  });
}

/* ---------- texte ---------- */
function t(){ return L[state.lang]; }

/* link de intoarcere la hub - textul se schimba o data cu limba */
var HOME_LBL = {ro:"Jocuri", en:"Games", sr:"Igre", src:"Игре"};
var HOME_TTL = {ro:"Inapoi la toate jocurile", en:"Back to all games",
                sr:"Nazad na sve igre", src:"Назад на све игре"};
function applyHome(){
  var a = $("homeBtn"), l = $("homeLbl");
  if(!a || !l) return;
  l.textContent = HOME_LBL[state.lang] || "Games";
  a.setAttribute("aria-label", HOME_TTL[state.lang] || "Back to all games");
  a.setAttribute("title", HOME_TTL[state.lang] || "Back to all games");
}

function applyTexts(){
  var d = t();
  applyHome();
  document.documentElement.lang = d.htmlLang;
  document.title = d.title;
  var m = document.querySelector('meta[name="description"]');
  if(m) m.setAttribute("content", d.desc);
  $("brandName").textContent = d.name;
  $("againBtn").textContent = d.again;
  $("peekBtn").textContent = d.peek;
  $("stPlayedL").textContent = d.played;
  $("stWonL").textContent = d.won;
  $("stStreakL").textContent = d.streak;
  $("stBestL").textContent = d.best;
  $("h1").textContent = d.h1;
  $("p1").textContent = d.p1;
  $("h2").textContent = d.h2;
  $("p2").textContent = d.p2;
  $("p3").textContent = d.p3;
  $("foot").textContent = d.foot;
  $("supportText").textContent = d.supportText + " ";
  $("supportLink").querySelector("span").textContent = d.supportLink;
  $("report").textContent = d.report;
  $("board").setAttribute("aria-label", d.name);
  var btns = document.querySelectorAll(".langs button");
  for(var i=0;i<btns.length;i++){
    btns[i].setAttribute("aria-pressed", btns[i].getAttribute("data-lang") === state.lang ? "true" : "false");
  }
}

/* ---------- tabla ---------- */
function shuffle(a){
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var x = a[i]; a[i] = a[j]; a[j] = x;
  }
  return a;
}

function buildDeck(){
  var list = W[state.lang][state.theme].slice(0, state.pairs);
  var cards = [];
  for(var i=0;i<list.length;i++){
    cards.push({ w:list[i], pair:i });
    cards.push({ w:list[i], pair:i });
  }
  state.deck = shuffle(cards);
}

function fontSizeFor(word){
  var n = word.length;
  if(n <= 4) return "clamp(18px,4.4vw,26px)";
  if(n <= 6) return "clamp(15px,3.6vw,22px)";
  if(n <= 8) return "clamp(12px,3vw,18px)";
  if(n <= 10) return "clamp(10px,2.4vw,15px)";
  return "clamp(9px,2.1vw,13px)";
}

function renderBoard(){
  var b = $("board");
  b.innerHTML = "";
  b.className = "board" + (state.pairs === 4 ? " p4" : (state.pairs === 8 ? " p8" : ""));
  for(var i=0;i<state.deck.length;i++){
    var c = state.deck[i];
    var t = document.createElement("button");
    t.type = "button";
    t.className = "tile";
    t.setAttribute("data-i", i);
    t.setAttribute("role", "gridcell");
    var open = state.open.indexOf(i) !== -1 || state.done[c.pair];
    if(open) t.className += " open";
    if(state.done[c.pair]) t.className += " done";
    t.setAttribute("aria-label", open ? c.w : "?");

    var back = document.createElement("span");
    back.className = "face back";
    back.textContent = "?";

    var front = document.createElement("span");
    front.className = "face front";
    front.textContent = c.w;
    front.style.fontSize = fontSizeFor(c.w);

    t.appendChild(back);
    t.appendChild(front);
    t.disabled = !!state.done[c.pair];
    t.addEventListener("click", (function(idx){ return function(){ turn(idx); }; })(i));
    b.appendChild(t);
  }
}

function renderChips(){
  var d = t();
  $("themeChip").textContent = d.cats[state.theme];
  $("sizeChip").textContent = state.pairs + " " + d.pairs;
  $("movesChip").textContent = d.moves + ": " + state.moves;
  var s = state.stats[state.lang];
  $("stPlayed").textContent = s.p;
  $("stWon").textContent = s.w;
  $("stStreak").textContent = s.s;
  $("stBest").textContent = s.b ? s.b + d.bestUnit : "0";
}

/* ---------- cronometru ---------- */
var tick = null;
function startClock(){
  if(tick) return;
  state.start = Date.now();
  tick = setInterval(function(){
    var sec = Math.floor((Date.now() - state.start)/1000);
    $("timeChip").textContent = t().time + ": " + mmss(sec);
  }, 500);
}
function stopClock(){ if(tick){ clearInterval(tick); tick = null; } }
function mmss(sec){
  var m = Math.floor(sec/60), s = sec % 60;
  return m + ":" + (s < 10 ? "0" + s : s);
}

/* ---------- logica ---------- */
function newGame(){
  stopClock();
  state.open = [];
  state.done = {};
  state.moves = 0;
  state.over = false;
  state.busy = false;
  state.peekUsed = 0;
  $("msg").textContent = "";
  $("msg").className = "msg";
  $("timeChip").textContent = t().time + ": 0:00";
  $("peekBtn").disabled = false;
  buildDeck();
  renderBoard();
  renderChips();
}

function turn(i){
  if(state.over || state.busy) return;
  if(state.done[state.deck[i].pair]) return;
  if(state.open.indexOf(i) !== -1) return;
  startClock();
  state.open.push(i);

  if(state.open.length === 1){
    renderBoard();
    return;
  }

  /* a doua carte */
  var a = state.open[0], b = state.open[1];
  state.moves++;
  var same = state.deck[a].pair === state.deck[b].pair;
  renderBoard();
  renderChips();

  if(same){
    state.done[state.deck[a].pair] = true;
    state.open = [];
    renderBoard();
    if(isWin()) win();
  } else {
    state.busy = true;
    setTimeout(function(){
      state.open = [];
      state.busy = false;
      renderBoard();
    }, 720);
  }
}

function isWin(){
  for(var k in state.deck){
    if(!state.done[state.deck[k].pair]) return false;
  }
  return true;
}

function win(){
  var d = t();
  state.over = true;
  stopClock();
  var s = state.stats[state.lang];
  s.p++; s.w++; s.s++;
  if(!s.b || state.moves < s.b) s.b = state.moves;
  save();
  $("msg").textContent = d.win + state.moves + d.winTail;
  $("msg").className = "msg win";
  $("peekBtn").disabled = true;
  renderChips();
}

function peek(){
  if(state.over || state.busy) return;
  var hidden = [];
  for(var i=0;i<state.deck.length;i++){
    if(!state.done[state.deck[i].pair] && state.open.indexOf(i) === -1) hidden.push(i);
  }
  if(!hidden.length) return;
  startClock();
  state.busy = true;
  state.moves++;
  state.peekUsed++;
  var before = state.open.slice();
  state.open = hidden.slice();
  renderBoard();
  renderChips();
  setTimeout(function(){
    state.open = before;
    state.busy = false;
    renderBoard();
  }, 900);
}

/* ---------- limba / tema / marime ---------- */
function setLang(l){
  if(!L[l]) return;
  state.lang = l;
  if(!W[l][state.theme]) state.theme = "animale";
  applyTexts();
  newGame();
  save();
}

function cycleTheme(){
  var keys = Object.keys(W[state.lang]);
  var i = keys.indexOf(state.theme);
  state.theme = keys[(i+1) % keys.length];
  newGame();
  save();
}

function cycleSize(){
  var i = SIZES.indexOf(state.pairs);
  state.pairs = SIZES[(i+1) % SIZES.length];
  newGame();
  save();
}

/* ---------- start ---------- */
load();
applyTexts();
initTheme();
state.theme = Object.keys(W[state.lang]).indexOf(state.theme) >= 0 ? state.theme : "animale";
newGame();

$("againBtn").addEventListener("click", newGame);
$("peekBtn").addEventListener("click", peek);
$("themeChip").addEventListener("click", cycleTheme);
$("sizeChip").addEventListener("click", cycleSize);

var langBtns = document.querySelectorAll(".langs button");
for(var i=0;i<langBtns.length;i++){
  langBtns[i].addEventListener("click", (function(b){ return function(){ setLang(b.getAttribute("data-lang")); }; })(langBtns[i]));
}

document.addEventListener("keydown", function(e){
  if(e.key === "Enter"){ newGame(); return; }
  if(e.key === " " && document.activeElement === document.body){ e.preventDefault(); peek(); }
});

})();
</script>
</body>
</html>
