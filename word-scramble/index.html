.dot{width:30px;height:30px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center}
.dot svg{display:block}
.spacer{flex:1}
.iconbtn{
  border:1px solid var(--line); background:var(--panel); color:var(--text);

  border-radius:10px; padding:8px 12px; font-size:14px; font-weight:600; line-height:1;
}
.homebtn:hover{border-color:var(--accent); color:var(--accent)}
.homebtn:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.homebtn .arw{font-size:15px; line-height:1}

.langs button{

  padding:6px 9px; border-radius:8px; cursor:pointer;
}
.langs button[aria-pressed="true"]{background:var(--panel); color:var(--text); box-shadow:var(--shadow)}
.card{
  background:var(--panel); border:1px solid var(--line); border-radius:16px;
  box-shadow:var(--shadow); padding:18px; margin-bottom:16px;
}
.topline{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:18px}
.chip{
  font-size:13px; font-weight:600; color:var(--muted); background:var(--panel2);
  border:1px solid var(--line); border-radius:999px; padding:4px 11px;
}
.chip.click{cursor:pointer}
.chip.click:hover{border-color:var(--accent)}
.chip b{color:var(--text)}
.slots{display:flex; flex-wrap:wrap; justify-content:center; gap:7px; margin:6px 0 22px; min-height:56px}
.slot{
  min-width:42px; height:54px; display:grid; place-items:center; cursor:pointer;
  border-bottom:3px solid var(--line); background:var(--panel2); border-radius:9px 9px 0 0;
  font-size:27px; font-weight:700; text-transform:uppercase; color:var(--text);
  border-top:0; border-left:0; border-right:0; font-family:inherit; padding:0 6px;
}
.slot.filled{border-bottom-color:var(--accent)}
.slot.hinted{border-bottom-color:var(--accent); color:var(--accent)}

  min-width:42px; height:48px; padding:0 10px; border-radius:10px; cursor:pointer;

  font:inherit; font-size:21px; font-weight:700; text-transform:uppercase;
}

.rack .tile:disabled{opacity:.25; cursor:default}
.rack .tile:focus-visible,.slot:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.msg{text-align:center; font-weight:600; min-height:26px; margin:16px 0 8px}

.btn{

.btn:disabled{opacity:.45; cursor:default; filter:none}
.stats{display:flex; gap:18px; justify-content:center; flex-wrap:wrap; margin-top:14px; color:var(--muted); font-size:14px}
.stats b{color:var(--text); font-size:17px; display:block; text-align:center}
.stats span{display:block; text-align:center}
h1{font-size:24px; letter-spacing:-.02em; margin:0 0 8px}
h2{font-size:18px; margin:22px 0 8px}
p{margin:0 0 12px; color:var(--muted)}

<style id="tinte-44">
/* regula casei: pe telefon, tinta de atingere are cel putin 44x44px (WCAG 2.5.5, Apple HIG).
   Se aplica doar pe pointer gros sau ecran mic, ca sa nu umfle interfata pe desktop.
   `!important` e intentionat: e un prag de accesibilitate, nu o preferinta de stil, iar
   fiecare unealta are propriile reguli de buton care ar castiga altfel.
   Tabla jocurilor (`.cell`, `.tile`, `.slot`, `.key`) este lasata afara: acolo marimea
   tintei e data de grila, nu de deget, si e tratata in blocul fiecarui joc. */
@media (pointer: coarse), (max-width: 700px) {
  html body :is(button, select, textarea, summary, [role="button"],
      input:not([type="checkbox"]):not([type="radio"]):not([type="file"]):not([type="hidden"]),
      label:has(input[type="checkbox"]), label:has(input[type="radio"]),
      .check, .check-label, .switch, .btn, .button):not(.cell):not(.tile):not(.slot):not(.key) {
    min-height: 44px !important;
  }
  html body :is(button, [role="button"], .btn, .button, .chip, .langbtn, .iconbtn, .icon-btn,
      .btn-icon, .icon-button, .swatch, .switch, .tbtn, .buy, .skip):not(.cell):not(.tile):not(.slot):not(.key) {
    display: inline-flex !important; align-items: center !important; justify-content: center !important;
  }
  html body :is(.iconbtn, .icon-btn, .btn-icon, .icon-button, .langbtn, .theme-toggle, .theme,
      .swatch, .switch, .tbtn, .swap, .play-button, .stop-button, .undo, .buy,
      .nav-btn, .editor-close, .round-btn, .chip-x, .close, .btn-close, .randomize-mini,
      .history > button, .swatches > button) {
    min-width: 44px !important; min-height: 44px !important;
  }
  html body :is(select, input[type="color"], input[type="number"], input[type="text"]) {
    min-width: 44px !important;
  }
  html body :is(input[type="checkbox"], input[type="radio"]) { min-width: 24px !important; min-height: 24px !important; }
  /* legaturile din afara textului curent (antet, subsol, navigatie); cele din propozitie
     ramin legaturi de text, cum spune si exceptia pentru text din WCAG 2.5.5.
     Cardurile-legatura isi pastreaza asezarea, doar inaltimea minima creste. */
  html body a:not(p a):not(li a):not(td a):not(.gcard):not(.card) {
    min-height: 44px !important; min-width: 44px !important;
  }
  html body :is(a.skip, .brand, a.buy) { display: inline-flex !important; align-items: center !important; }
  /* barele care nu incapeau: se asaza pe doua randuri in loc sa iasa din ecran */
  html body :is(nav, .nav, .navbar, .toolbar, .links, footer, .footnotes, .player-controls,
      header, .topbar, .masthead, .app-header,
      .topbar-actions, .header-actions, .hero-actions, .actions, .action-row,
      .btn-row, .button-row, .controls, .controls-row, .filters,
      .topbar-inner, .header-inner, .nav-inner, .bar-inner,
      [class$="-inner"], [class$="-actions"]) {
    flex-wrap: wrap !important;
  }
  html body input[type="range"] { height: 44px !important; }
  /* campurile de fisier sunt suprapuse peste zona de tragere si nu trebuie sa iasa din ea */
  html body :is(input[type="file"], input[type="color"], img, video, canvas) { max-width: 100% !important; }
}
</style>
<style id="tinte-44-joc">
/* tabla si tastatura sunt grile cu coloane fixe: 12 coloane (cautare) sau 10 clape pe rand
   (ghiceste, cuvantul zilei) nu incap la 44px pe niciun telefon. Acolo tinta ramane celula
   grilei; inaltimea clapelor se ridica totusi la 44px, ca sa fie usor de nimerit pe verticala. */
@media (pointer: coarse), (max-width: 700px) {
  /* Doar tabla de cautare (8 coloane x 44 = 352px) si tastatura (10 clape pe rand) sunt
     grile cu coloane fixe, unde 44px pe latime nu incape pe niciun telefon: acolo tinta
     ramane celula grilei, iar clapele au 44px inaltime ca sa fie usor de nimerit. */
  html body :is(.cell, .key) { min-width: 0 !important; }
  html body .cell { min-height: 0 !important; }
  html body .key { min-height: 44px !important; }
  /* Litera din teanc si caseta din cuvant NU sunt intr-o grila: se asaza pe randuri si se
     pot infasura, deci pot avea 44px pe latime. Inainte erau scoase din regula generala
     de 44px, iar caseta goala ajungea la 6px latime, adica o linie verticala: cuvantul de
     ghicit nici nu se mai vedea. */
  html body .rack .tile, html body .slot { min-width: 44px !important; min-height: 44px !important; }
}
</style>

/* ---------- cuvinte: aceleasi 24 pe tema, in fiecare limba ---------- */
var W = {

    mancare:["MĂMĂLIGĂ","CIORBĂ","PAPANAȘI","SLĂNINĂ","BRÂNZĂ","ZACUSCĂ","PLĂCINTĂ","CÂRNAȚI","SARMALE","PIURE","OMELETĂ","BORȘ","FRIPTURĂ","SALATĂ","GOGOAȘI","MIERE"],
    locuri:["MUNTE","CASTEL","ORAȘ","BISERICĂ","POD","PORT","PALAT","TURN","GRĂDINĂ","PĂDURE","MUZEU","BIBLIOTECĂ","GARĂ","PIAȚĂ","FARMĂ","FAR"]
  },
  en:{
    animale:["ELEPHANT","PENGUIN","DOLPHIN","SQUIRREL","BUTTERFLY","CROCODILE","HEDGEHOG","PEACOCK","RABBIT","TORTOISE","SPARROW","OCTOPUS","KANGAROO","GIRAFFE","BEAVER","FALCON"],

    mancare:["PALAČINKE","KAJMAK","PROJA","GIBANICA","KOLAČ","ČORBA","ŠTRUDLA","PLJESKAVICA","PITA","SIR","MED","SALATA","SUPA","KROFNA","AJVAR","PECIVO"],
    locuri:["TVRĐAVA","MOST","MUZEJ","BIBLIOTEKA","ŠUMA","DŽAMIJA","PLANINA","OSTRVO","BAŠTA","GARA","PIJACA","CRKVA","TUNEL","FABRIKA","ŠKOLA","BOLNICA"]
  },
  src:{
    animale:["ВЕВЕРИЦА","КОРЊАЧА","ЛЕПТИР","ДЕЛФИН","ПИНГВИН","ЖИРАФА","МЕДВЕД","ЋУРАН","ЗЕЦ","ЛИСИЦА","ЈЕЛЕН","СОВА","ПАПАГАЈ","МРАВ","КОЊ","ОВЦА"],
    mancare:["ПАЛАЧИНКЕ","КАЈМАК","ПРОЈА","ГИБАНИЦА","КОЛАЧ","ЧОРБА","ШТРУДЛА","ПЉЕСКАВИЦА","ПИТА","СИР","МЕД","САЛАТА","СУПА","КРОФНА","АЈВАР","ПЕЦИВО"],
    locuri:["ТВРЂАВА","МОСТ","МУЗЕЈ","БИБЛИОТЕКА","ШУМА","ЏАМИЈА","ПЛАНИНА","ОСТРВО","БАШТА","ГАРА","ПИЈАЦА","ЦРКВА","ТУНЕЛ","ФАБРИКА","ШКОЛА","БОЛНИЦА"]
  }
};

var KEY = "word-scramble-v1";

var $ = function(id){ return document.getElementById(id); };

var state = {
  lang:"en",
  theme:"animale",
  word:"",
  rack:[],        /* [{ch, used}] */
  slots:[],       /* index in rack sau null */
  hinted:[],      /* pozitii completate cu indiciu */
  score:0,
  over:false,
  busy:false,
  stats:{ro:{p:0,w:0,s:0,b:0},en:{p:0,w:0,s:0,b:0},sr:{p:0,w:0,s:0,b:0},src:{p:0,w:0,s:0,b:0}}
};

/* ---------- persistenta ---------- */
function load(){
  state.lang = "en";              /* limba principala: engleza (regula 29.10.2026) */
  try{
    var raw = localStorage.getItem(KEY);
    if(!raw) return;
    var d = JSON.parse(raw);
    if(d && d.stats){
      for(var k in state.stats){
        if(d.stats[k]) state.stats[k] = {
          p:+d.stats[k].p||0, w:+d.stats[k].w||0, s:+d.stats[k].s||0, b:+d.stats[k].b||0
        };
      }
    }
    if(d && d.lang && L[d.lang]) state.lang = d.lang;
    if(d && d.theme && W[state.lang][d.theme]) state.theme = d.theme;
  }catch(e){}
}
function save(){
  try{
    localStorage.setItem(KEY, JSON.stringify({stats:state.stats, lang:state.lang, theme:state.theme}));
  }catch(e){}
}

/* ---------- tema light/dark ---------- */
function applyTheme(t){
  if(t){ document.documentElement.setAttribute("data-theme", t); }
  else { document.documentElement.removeAttribute("data-theme"); }
}
function initTheme(){
  var saved = null;
  try{ saved = localStorage.getItem(KEY + "-theme"); }catch(e){}
  applyTheme(saved);
  $("themeBtn").addEventListener("click", function(){
    var cur = document.documentElement.getAttribute("data-theme");
    var dark = cur ? cur === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    var next = dark ? "light" : "dark";
    applyTheme(next);
    try{ localStorage.setItem(KEY + "-theme", next); }catch(e){}
  });
}

/* ---------- texte ---------- */
function t(){ return L[state.lang]; }

/* link de intoarcere la hub - textul se schimba o data cu limba */
var HOME_LBL = {ro:"Jocuri", en:"Games", sr:"Igre", src:"Игре"};
var HOME_TTL = {ro:"Inapoi la toate jocurile", en:"Back to all games",
                sr:"Nazad na sve igre", src:"Назад на све игре"};
function applyHome(){
  var a = $("homeBtn"), l = $("homeLbl");
  if(!a || !l) return;
  l.textContent = HOME_LBL[state.lang] || "Games";
  a.setAttribute("aria-label", HOME_TTL[state.lang] || "Back to all games");
  a.setAttribute("title", HOME_TTL[state.lang] || "Back to all games");
}

function applyTexts(){
  var d = t();
  applyHome();
  document.documentElement.lang = d.htmlLang;
  document.title = d.title;
  var m = document.querySelector('meta[name="description"]');
  if(m) m.setAttribute("content", d.desc);
  $("brandName").textContent = d.name;
  $("againBtn").textContent = d.again;
  $("hintBtn").textContent = d.hint;
  $("clearBtn").textContent = d.clear;
  $("stPlayedL").textContent = d.played;
  $("stWonL").textContent = d.won;
  $("stStreakL").textContent = d.streak;
  $("stBestL").textContent = d.best;
  $("h1").textContent = d.h1;
  $("p1").textContent = d.p1;
  $("h2").textContent = d.h2;
  $("p2").textContent = d.p2;
  $("p3").textContent = d.p3;
  $("foot").textContent = d.foot;
  $("supportText").textContent = d.supportText + " ";
  $("supportLink").querySelector("span").textContent = d.supportLink;
  $("report").textContent = d.report;
  var btns = document.querySelectorAll(".langs button");
  for(var i=0;i<btns.length;i++){
    btns[i].setAttribute("aria-pressed", btns[i].getAttribute("data-lang") === state.lang ? "true" : "false");
  }
}

/* ---------- joc ---------- */
function shuffle(a){
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var x = a[i]; a[i] = a[j]; a[j] = x;
  }
  return a;
}

function buildRack(word){
  var litere = word.split("");
  var amestec = shuffle(litere.slice());
  /* daca din întâmplare iese exact cuvântul - sau iese în ordine alfabetică, adică un
     „amestec" care nu arată amestecat - mai amestecăm o dată */
  var ordineAlfabetica = litere.slice().sort().join("");
  var incercari = 0;
  while((amestec.join("") === word || amestec.join("") === ordineAlfabetica) && incercari < 20){
    amestec = shuffle(litere.slice());
    incercari++;
  }
  return amestec.map(function(ch){ return { ch:ch, used:false }; });
}

function pickWord(){
  var list = W[state.lang][state.theme];
  var pool = list.filter(function(w){ return w !== state.word; });
  if(!pool.length) pool = list;
  return pool[Math.floor(Math.random()*pool.length)];
}

function newGame(){
  state.word = pickWord();
  state.rack = buildRack(state.word);
  state.slots = new Array(state.word.length).fill(null);
  state.hinted = [];
  state.over = false;
  state.busy = false;
  $("slots").className = "slots";
  $("msg").textContent = "";
  $("msg").className = "msg";
  $("hintBtn").disabled = false;
  $("clearBtn").disabled = false;
  render();
}

function render(){
  var d = t();

  /* sloturi */
  var box = $("slots");
  box.innerHTML = "";
  box.className = "slots" + (state.over ? " done" : "");
  for(var i=0;i<state.slots.length;i++){
    var b = document.createElement("button");
    b.type = "button";
    b.className = "slot";
    var ri = state.slots[i];
    if(ri !== null){
      b.className += " filled";
      if(state.hinted.indexOf(i) !== -1) b.className += " hinted";
      b.textContent = state.rack[ri].ch;
      b.setAttribute("aria-label", state.rack[ri].ch);
      b.addEventListener("click", (function(pos){ return function(){ takeOut(pos); }; })(i));
    } else {
      b.setAttribute("aria-label", "?");
      b.textContent = "";
      b.disabled = true;
    }
    box.appendChild(b);
  }

  /* literele amestecate */
  var rack = $("rack");
  rack.innerHTML = "";
  for(var j=0;j<state.rack.length;j++){
    var t2 = document.createElement("button");
    t2.type = "button";
    t2.className = "tile";
    t2.textContent = state.rack[j].ch;
    t2.setAttribute("data-k", state.rack[j].ch);
    t2.disabled = state.rack[j].used || state.over;
    if(!t2.disabled){
      t2.addEventListener("click", (function(idx){ return function(){ place(idx); }; })(j));
    }
    rack.appendChild(t2);
  }

  /* chip-uri si statistici */
  $("themeChip").textContent = d.cats[state.theme];
  $("lenChip").textContent = state.word.length + " " + d.letters;
  $("scoreChip").textContent = d.score + ": " + state.score;
  var s = state.stats[state.lang];
  $("stPlayed").textContent = s.p;
  $("stWon").textContent = s.w;
  $("stStreak").textContent = s.s;
  $("stBest").textContent = s.b;
}

function firstEmpty(){
  for(var i=0;i<state.slots.length;i++) if(state.slots[i] === null) return i;
  return -1;
}

function place(idx){
  if(state.over || state.busy) return;
  if(state.rack[idx].used) return;
  var slot = firstEmpty();
  if(slot === -1) return;
  state.rack[idx].used = true;
  state.slots[slot] = idx;
  state.hinted = state.hinted.filter(function(p){ return p !== slot; });
  render();
  check();
}

function takeOut(pos){
  if(state.over || state.busy) return;
  var ri = state.slots[pos];
  if(ri === null) return;
  state.rack[ri].used = false;
  state.slots[pos] = null;
  state.hinted = state.hinted.filter(function(p){ return p !== pos; });
  render();
}

function clearAll(){
  if(state.over) return;
  state.busy = false;
  $("slots").className = "slots";
  for(var i=0;i<state.slots.length;i++){
    if(state.slots[i] !== null){
      state.rack[state.slots[i]].used = false;
      state.slots[i] = null;
    }
  }
  state.hinted = [];
  $("msg").textContent = "";
  $("msg").className = "msg";
  render();
}

function current(){
  var out = "";
  for(var i=0;i<state.slots.length;i++){
    out += state.slots[i] === null ? "?" : state.rack[state.slots[i]].ch;
  }
  return out;
}

function check(){
  if(firstEmpty() !== -1) return;
  var d = t();
  if(current() === state.word){
    state.over = true;
    var castig = Math.max(1, state.word.length - state.hinted.length);
    state.score += castig;
    var s = state.stats[state.lang];
    s.p++; s.w++; s.s++;
    if(s.s > s.b) s.b = s.s;
    save();
    $("msg").textContent = d.win + state.word;
    $("msg").className = "msg win";
    $("hintBtn").disabled = true;
    $("clearBtn").disabled = true;
    render();
    return;
  }
  /* nu e bine: scuturăm și lăsăm literele pe loc, ca să poți scoate */
  state.busy = true;
  $("msg").textContent = d.shake;
  $("msg").className = "msg bad";
  $("slots").className = "slots shake";
  setTimeout(function(){
    state.busy = false;
    $("slots").className = "slots";
  }, 650);
  var s2 = state.stats[state.lang];
  /* o încercare greșită nu încheie jocul, dar rupe seria */
  if(s2.s !== 0){ s2.s = 0; save(); }
  render();
}

function revealHint(){
  if(state.over || state.busy) return;
  var d = t();
  var slot = firstEmpty();
  if(slot === -1){
    /* toate plin dar greșit: scoatem întâi pozitiile greșite si aratam urmatoarea */
    for(var i=0;i<state.slots.length;i++){
      var ri = state.slots[i];
      if(ri !== null && state.rack[ri].ch !== state.word[i] && state.hinted.indexOf(i) === -1){
        slot = i;
        break;
      }
    }
    if(slot === -1){ $("msg").textContent = d.hintNone; return; }
  }
  var litera = state.word[slot];
  /* cautam o litera nefolosita care se potriveste */
  var gasit = -1;
  for(var j=0;j<state.rack.length;j++){
    if(!state.rack[j].used && state.rack[j].ch === litera){ gasit = j; break; }
  }
  if(gasit === -1){
    /* nu exista: luam orice litera libera si o transformam */
    for(var k=0;k<state.rack.length;k++){
      if(!state.rack[k].used){ gasit = k; state.rack[k].ch = litera; break; }
    }
  }
  if(gasit === -1){ $("msg").textContent = d.hintNone; return; }
  /* daca slotul era ocupat cu altceva, eliberam litera veche */
  if(state.slots[slot] !== null) state.rack[state.slots[slot]].used = false;
  state.rack[gasit].used = true;
  state.slots[slot] = gasit;
  if(state.hinted.indexOf(slot) === -1) state.hinted.push(slot);
  $("msg").textContent = "";
  $("msg").className = "msg";
  render();
  check();
}

/* ---------- limba / tema ---------- */
function setLang(l){
  if(!L[l]) return;
  state.lang = l;
  if(!W[l][state.theme]) state.theme = "animale";
  applyTexts();
  newGame();
  save();
}

function cycleTheme(){
  var keys = Object.keys(W[state.lang]);
  var i = keys.indexOf(state.theme);
  state.theme = keys[(i+1) % keys.length];
  newGame();
  save();
}

/* ---------- start ---------- */
load();
applyTexts();
initTheme();
state.theme = Object.keys(W[state.lang]).indexOf(state.theme) >= 0 ? state.theme : "animale";
newGame();

$("againBtn").addEventListener("click", newGame);
$("hintBtn").addEventListener("click", revealHint);
$("clearBtn").addEventListener("click", clearAll);
$("themeChip").addEventListener("click", cycleTheme);

var langBtns = document.querySelectorAll(".langs button");
for(var i=0;i<langBtns.length;i++){
  langBtns[i].addEventListener("click", (function(b){ return function(){ setLang(b.getAttribute("data-lang")); }; })(langBtns[i]));
}

document.addEventListener("keydown", function(e){
  if(e.key === "Enter"){
    /* Enter nu trebuie sa apese si butonul care are focusul */
    e.preventDefault();
    if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
    newGame();
    return;
  }
  if(e.key === "Backspace"){
    e.preventDefault();
    for(var i=state.slots.length-1;i>=0;i--){
      if(state.slots[i] !== null){ takeOut(i); return; }
    }
    return;
  }
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  if(e.key.length !== 1) return;

  var ch = e.key.toUpperCase();
  /* potrivire exacta intai (pentru diacritice), apoi fara diacritice */
  var gol = function(s){ return s.normalize("NFD").replace(/[\u0300-\u036f]/g, ""); };
  var idx = -1;
  for(var j=0;j<state.rack.length;j++){
    if(!state.rack[j].used && state.rack[j].ch === ch){ idx = j; break; }
  }
  if(idx === -1){
    for(var k=0;k<state.rack.length;k++){
      if(!state.rack[k].used && gol(state.rack[k].ch) === gol(ch)){ idx = k; break; }
    }
  }
  if(idx !== -1){ e.preventDefault(); place(idx); }
});

})();
</script>
